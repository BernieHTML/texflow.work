<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ellipse Inbox</title>
  <link rel="icon" href="/ellipse/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/ellipse/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="side">
      <div class="side-main">
        <div class="brand">
          <svg width="28" height="20" viewBox="0 0 80 50"><ellipse cx="40" cy="25" rx="36" ry="18" fill="none" stroke="#1D9E75" stroke-width="4" transform="rotate(-25 40 25)"/></svg>
          <strong>Ellipse</strong>
        </div>
        <p id="handle">you@texflow.work</p>
        <section class="my-token-card">
          <span>My TEX Token</span>
          <code id="tokenPreview">tex_tok_...</code>
          <button class="button ghost small-button" id="copyToken" type="button">Copy token</button>
        </section>
        <nav class="nav-list">
          <a href="/ellipse/token">Get TEX Token</a>
          <a href="#" data-filter="all">All</a>
          <a href="#" data-filter="world">World</a>
          <a href="#" data-filter="circle">Circle</a>
          <a href="/ellipse/api/inbox">Following</a>
          <a href="/ellipse/my-channels">My Channels</a>
          <a href="/ellipse/messages">Messages</a>
        </nav>
        <h3>World</h3>
        <div id="worldList"></div>
        <h3>Circle</h3>
        <div id="circleList"></div>
      </div>
      <button class="button ghost logout-button" id="logout" type="button">Log out</button>
    </aside>
    <main class="feed">
      <div class="feed-top">
        <div class="status"><span id="dot" class="dot"></span><span id="statusText">Connecting with your TEX token.</span></div>
        <button class="button ghost small-button" id="refreshInbox" type="button">Refresh inbox</button>
      </div>
      <div id="feed" class="feed-scroll"></div>
      <div class="feed-bottom">
        <button class="button ghost" id="loadMore" type="button">Load more</button>
      </div>
    </main>
    <aside class="context">
      <h3>Following</h3>
      <div id="following"></div>
      <h3>World signals</h3>
      <div id="worldSignals"></div>
      <h3>Pending requests</h3>
      <p class="muted">Owner approval controls are available through the API.</p>
    </aside>
  </div>
  <script>
    const token = localStorage.getItem('ellipseToken') || '';
    if (!token) window.location.replace('/ellipse/login');
    const feed = document.getElementById('feed');
    const dot = document.getElementById('dot');
    const statusText = document.getElementById('statusText');
    let filter = 'all', items = [], limit = 50;

    function rel(ts) {
      const seconds = Math.max(1, Math.floor((Date.now() - Date.parse(ts || new Date())) / 1000));
      if (seconds < 60) return seconds + ' sec ago';
      if (seconds < 3600) return Math.floor(seconds / 60) + ' min ago';
      return Math.floor(seconds / 3600) + ' hr ago';
    }
    function render() {
      const visible = items.filter(item => filter === 'all' || item.source === filter).slice(0, limit);
      feed.innerHTML = visible.map(item => `
        <article class="card feed-card">
          <span class="badge ${item.source}">${item.source}</span>
          <p>${item.channel || ''} ${item.owner ? '· ' + item.owner : ''}</p>
          <h3>${item.title || item.type || 'Update'}</h3>
          <p>${item.body_preview || JSON.stringify(item.payload || {}).slice(0, 160)}</p>
          <p>${rel(item.published_at)} · <a href="${detailUrl(item)}">Read more -></a></p>
        </article>`).join('') || '<p>No inbox items yet.</p>';
    }
    function detailUrl(item) {
      if (item.more_url) return item.more_url;
      if (item.source === 'world' && item.channel) return '/ellipse/events/world/' + encodeURIComponent(item.channel);
      if (item.id) return '/ellipse/posts/' + encodeURIComponent(item.id);
      return '#';
    }
    function previewToken(value) {
      if (!value) return 'tex_tok_...';
      return value.length > 18 ? value.slice(0, 14) + '...' + value.slice(-6) : value;
    }
    async function loadSnapshot() {
      if (!token) return;
      const res = await fetch('/ellipse/api/inbox?limit=50', { headers: { 'X-Tex-Token': token } });
      if (!res.ok) {
        localStorage.removeItem('ellipseToken');
        window.location.replace('/ellipse/login');
        return;
      }
      const data = await res.json();
      document.getElementById('handle').textContent = data.handle;
      items = data.items || [];
      document.getElementById('worldList').innerHTML = items.filter(i => i.source === 'world').map(i => `<p>${i.channel}</p>`).join('');
      document.getElementById('circleList').innerHTML = items.filter(i => i.source === 'circle').map(i => `<p>${i.channel}</p>`).join('');
      document.getElementById('following').innerHTML = document.getElementById('circleList').innerHTML || '<p>No circle channels yet.</p>';
      document.getElementById('worldSignals').innerHTML = document.getElementById('worldList').innerHTML || '<p>No world channels yet.</p>';
      render();
    }
    function connect() {
      if (!token) return;
      const es = new EventSource('/ellipse/api/inbox/stream?token=' + encodeURIComponent(token));
      es.onopen = () => { dot.classList.add('on'); statusText.textContent = 'SSE connected'; };
      es.onerror = () => { dot.classList.remove('on'); statusText.textContent = 'Reconnecting'; };
      es.onmessage = ev => { items.unshift(JSON.parse(ev.data)); render(); };
      ['post','update','price_update','earthquake','source_error'].forEach(name => {
        es.addEventListener(name, ev => { items.unshift(JSON.parse(ev.data)); render(); });
      });
    }
    document.querySelectorAll('[data-filter]').forEach(a => a.addEventListener('click', ev => {
      ev.preventDefault(); filter = a.dataset.filter; render();
    }));
    document.getElementById('tokenPreview').textContent = previewToken(token);
    document.getElementById('copyToken').addEventListener('click', async () => {
      await navigator.clipboard.writeText(token);
      document.getElementById('copyToken').textContent = 'Copied';
      setTimeout(() => { document.getElementById('copyToken').textContent = 'Copy token'; }, 1400);
    });
    document.getElementById('logout').addEventListener('click', () => {
      localStorage.removeItem('ellipseToken');
      window.location.href = '/ellipse/login';
    });
    document.getElementById('refreshInbox').addEventListener('click', async () => {
      const button = document.getElementById('refreshInbox');
      button.textContent = 'Refreshing...';
      await loadSnapshot();
      button.textContent = 'Refresh inbox';
    });
    document.getElementById('loadMore').addEventListener('click', () => { limit += 50; render(); });
    loadSnapshot().then(connect);
  </script>
</body>
</html>
