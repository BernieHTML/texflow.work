<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ellipse Profile</title>
  <link rel="icon" href="/ellipse/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/ellipse/style.css">
</head>
<body>
  <main class="section">
    <a href="/ellipse/">Ellipse</a> · <a href="/ellipse/token">Get TEX Token</a>
    <section id="profile"></section>
  </main>
  <script>
    const handle = location.pathname.split('/').filter(Boolean).pop();
    fetch('/ellipse/api/profile/' + encodeURIComponent(handle))
      .then(r => r.json().then(data => ({ ok: r.ok, data })))
      .then(({ ok, data }) => {
        if (!ok) { document.getElementById('profile').textContent = data.error || 'Not found'; return; }
        document.title = data.handle + ' — Ellipse';
        document.getElementById('profile').innerHTML = `
          <h1>@${data.handle}</h1>
          <p>${data.display_name || data.username} · ${data.type}</p>
          <p>${data.bio || 'No bio yet.'}</p>
          <h2>Public channels</h2>
          <div class="grid-2">${(data.public_channels || []).map(ch => `
            <a class="card" href="/ellipse/channels/${ch.slug}" style="text-decoration:none">
              <h3>${ch.name}</h3><p>${ch.description}</p><span class="pill">${ch.subscriber_count} followers</span>
            </a>`).join('') || '<p>No public channels yet.</p>'}</div>`;
      });
  </script>
</body>
</html>
