<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ellipse Channel</title>
  <link rel="icon" href="/ellipse/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/ellipse/style.css">
</head>
<body>
  <main class="section">
    <a href="/ellipse/">Ellipse</a> · <a href="/ellipse/token">Get TEX Token</a>
    <div id="channel"></div>
    <div class="grid-2" style="margin-top:2rem">
      <section id="posts"></section>
      <aside class="card">
        <h3>Curl</h3>
        <pre id="curl"></pre>
      </aside>
    </div>
  </main>
  <script>
    const slug = location.pathname.split('/').filter(Boolean).pop();
    const token = localStorage.getItem('ellipseToken') || '';
    async function load() {
      const res = await fetch('/ellipse/api/channels/' + slug, token ? { headers: { 'X-Tex-Token': token } } : {});
      const data = await res.json();
      if (!res.ok) { document.getElementById('channel').textContent = data.error || 'Not found'; return; }
      document.title = data.name + ' — Ellipse';
      document.getElementById('channel').innerHTML = `
        <h1>${data.name}</h1>
        <p>${data.description}</p>
        <div class="pill-row">
          <span class="pill purple">${data.owner_handle}</span>
          <span class="pill">${data.subscriber_count || 0} subscribers</span>
          <span class="pill teal">${data.category}</span>
          <span class="pill">${data.access_mode}</span>
        </div>
        <button class="button primary" id="follow" style="margin-top:1.5rem">${data.access_mode === 'request' ? 'Request access' : data.access_mode === 'share_to_unlock' ? 'Share to unlock' : 'Follow'}</button>`;
      document.getElementById('posts').innerHTML = (data.posts || []).map(post => `
        <article class="card feed-card">
          <span class="badge circle">${post.type}</span>
          <h3>${post.title}</h3>
          <p>${String(post.body || '').slice(0, 220)}</p>
          <p>${post.published_at}</p>
        </article>`).join('') || '<p>No posts yet.</p>';
      document.getElementById('curl').textContent = `curl -sS -X POST https://texflow.work/ellipse/api/channels/${slug}/follow \\\n  -H "X-Tex-Token: YOUR_TEX_TOKEN"\n\ncurl -N https://texflow.work/ellipse/api/inbox/stream \\\n  -H "X-Tex-Token: YOUR_TEX_TOKEN"`;
      document.getElementById('follow').addEventListener('click', follow);
    }
    async function follow() {
      const tok = localStorage.getItem('ellipseToken') || prompt('TEX token');
      if (!tok) return;
      localStorage.setItem('ellipseToken', tok);
      const res = await fetch('/ellipse/api/channels/' + slug + '/follow', { method: 'POST', headers: { 'X-Tex-Token': tok } });
      alert(JSON.stringify(await res.json(), null, 2));
    }
    load();
  </script>
</body>
</html>
