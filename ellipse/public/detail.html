<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ellipse Detail</title>
  <link rel="icon" href="/ellipse/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/ellipse/style.css">
</head>
<body>
  <main class="section detail-page">
    <a href="/ellipse/inbox">Ellipse inbox</a>
    <section id="detail" class="card detail-card">
      <p>Loading...</p>
    </section>
  </main>

  <script>
    const token = localStorage.getItem('ellipseToken') || '';
    if (!token) window.location.replace('/ellipse/login');

    const detail = document.getElementById('detail');
    const parts = location.pathname.split('/').filter(Boolean);
    const isWorld = parts[1] === 'events' && parts[2] === 'world';
    const id = parts[parts.length - 1];

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    function curlPanel(command) {
      if (!command) return '';
      return `
        <section class="owner-panel">
          <h3>Stream curl</h3>
          <p>Use this command to stream future events from this source.</p>
          <div class="owner-curl">
            <div class="owner-curl-head">
              <strong>Copy and run</strong>
              <button class="copy-button inline-copy" type="button" data-copy="${escapeHtml(command)}">Copy</button>
            </div>
            <pre>${escapeHtml(command)}</pre>
          </div>
        </section>`;
    }

    function bindCopy() {
      detail.querySelectorAll('[data-copy]').forEach(button => {
        button.addEventListener('click', async () => {
          await navigator.clipboard.writeText(button.dataset.copy);
          button.textContent = 'Copied';
          setTimeout(() => { button.textContent = 'Copy'; }, 1400);
        });
      });
    }

    async function load() {
      const endpoint = isWorld
        ? `/ellipse/api/world/${encodeURIComponent(id)}/latest`
        : `/ellipse/api/posts/${encodeURIComponent(id)}`;
      const response = await fetch(endpoint, { headers: { 'X-Tex-Token': token } });
      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        detail.innerHTML = `<h1>Could not load item.</h1><p>${escapeHtml(data.error || 'Unknown error')}</p>`;
        return;
      }

      document.title = `${data.title || data.channel || 'Ellipse item'} - Ellipse`;

      if (isWorld) {
        detail.innerHTML = `
          <span class="badge world">world</span>
          <h1>${escapeHtml(data.title || data.channel)}</h1>
          <p>${escapeHtml(data.description || data.channel)}</p>
          <p>${escapeHtml(data.published_at || '')}</p>
          <section class="owner-panel">
            <h3>Full event message</h3>
            <pre>${escapeHtml(JSON.stringify(data.payload || data, null, 2))}</pre>
          </section>
          ${curlPanel(data.stream_curl)}`;
      } else {
        detail.innerHTML = `
          <span class="badge circle">circle</span>
          <h1>${escapeHtml(data.title)}</h1>
          <p>${escapeHtml(data.channel?.name || data.channel_slug || '')} · ${escapeHtml(data.author_handle || '')}</p>
          <p>${escapeHtml(data.published_at || '')}</p>
          <section class="owner-panel">
            <h3>Full post</h3>
            <p class="post-body">${escapeHtml(data.body)}</p>
          </section>
          ${data.payload ? `<section class="owner-panel"><h3>Payload</h3><pre>${escapeHtml(JSON.stringify(data.payload, null, 2))}</pre></section>` : ''}
          ${curlPanel(data.stream_curl)}`;
      }

      bindCopy();
    }

    load();
  </script>
</body>
</html>
