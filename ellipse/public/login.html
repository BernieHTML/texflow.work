<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — Ellipse</title>
  <link rel="icon" href="/ellipse/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/ellipse/style.css">
</head>
<body>
  <main class="section token-page">
    <a href="/ellipse/">Ellipse</a>
    <h1>Log in with your TEX token.</h1>
    <p>Paste your `tex_tok_...` token. Ellipse stores it locally in this browser and uses it to open your inbox.</p>

    <form class="form token-card" id="loginForm">
      <label>TEX token
        <input name="token" required pattern="tex_tok_[A-Za-z0-9]+" placeholder="tex_tok_...">
      </label>
      <button class="button primary" type="submit">Open inbox -></button>
      <a class="button ghost" href="/ellipse/token">Need a TEX token?</a>
    </form>
    <section id="result" class="card token-result" hidden></section>
  </main>
  <script>
    const form = document.getElementById('loginForm');
    const result = document.getElementById('result');

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const token = String(new FormData(form).get('token') || '').trim();
      result.hidden = false;
      result.innerHTML = '<p>Checking token...</p>';

      const response = await fetch('/ellipse/api/whoami', {
        headers: { 'X-Tex-Token': token }
      });
      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        result.innerHTML = `<h3>Token not accepted</h3><p>${data.error || 'Please check the token and try again.'}</p>`;
        return;
      }

      localStorage.setItem('ellipseToken', token);
      result.innerHTML = `<h3>Welcome back.</h3><p>${data.handle}</p>`;
      window.location.href = '/ellipse/inbox';
    });
  </script>
</body>
</html>
