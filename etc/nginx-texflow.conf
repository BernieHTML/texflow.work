# Nginx reverse proxy for TexFlow (texflow.work)
# Include or paste into a server block. TLS and server_name are your responsibility.
# Proxy all traffic (including /.well-known/) to the Node app so that
# /.well-known/vyex.json and other discovery endpoints are served by the app.

upstream texflow {
    server 127.0.0.1:5001;
    keepalive 32;
}

upstream texmkt-mcp {
    server 127.0.0.1:5002;
    keepalive 8;
}

server {
    listen 80;
    server_name texflow.work www.texflow.work;
    # Redirect to HTTPS in production:
    # return 301 https://$server_name$request_uri;

    location / {
        proxy_pass http://texflow;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ensure .well-known is proxied to the app (do not serve static files for .well-known)
    location /.well-known/ {
        proxy_pass http://texflow;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # TexMKT MCP server (Streamable HTTP; Claude Desktop connects here)
    location /mcp {
        proxy_pass http://texmkt-mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

