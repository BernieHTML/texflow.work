# Nginx reverse proxy for TexFlow (texflow.work)
# Include or paste into a server block. TLS and server_name are your responsibility.
# Proxy all traffic (including /.well-known/) to the Node app so that
# /.well-known/vyex.json and other discovery endpoints are served by the app.
#
# If you use a separate location only for ACME (e.g. certbot), scope it to
# `/.well-known/acme-challenge/` only — do not map all of `/.well-known/` to a
# static directory, or routes like `/.well-known/agent-entry.md` will 404 and
# the /agent/ page will not load its markdown from the network.

upstream texflow {
    server 127.0.0.1:5001;
    keepalive 32;
}

server {
    listen 80;
    server_name texflow.work www.texflow.work;
    # Redirect to HTTPS in production:
    # return 301 https://$server_name$request_uri;

    location / {
        proxy_pass http://texflow;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ensure .well-known is proxied to the app (do not serve static files for .well-known)
    location /.well-known/ {
        proxy_pass http://texflow;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

