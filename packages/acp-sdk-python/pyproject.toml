[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "texflow-acp-sdk"
version = "1.0.0"
description = "TexFlow Agentic Commerce Protocol SDK for Python"
requires-python = ">=3.9"
dependencies = ["httpx>=0.24.0"]

[tool.setuptools.packages.find]
where = ["src"]
