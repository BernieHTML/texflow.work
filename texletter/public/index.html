<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TexLetter</title>
    <link rel="stylesheet" href="/texletter/styles.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/texletter">TexLetter</a>
      <nav>
        <a href="/texletter">Registry</a>
        <a href="/texletter/dashboard">Dashboard</a>
        <button id="authButton" class="button ghost" type="button">Sign in with textoken</button>
      </nav>
    </header>

    <main id="app" class="shell"></main>

    <div id="authModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="authTitle">
      <div class="modal-card">
        <button id="closeAuth" class="icon-button" type="button" aria-label="Close">×</button>
        <h2 id="authTitle">Sign in with textoken</h2>
        <p>Paste a shared TexFlow textoken. It starts with <code>tex_tok_</code>.</p>
        <input id="tokenInput" class="input" placeholder="tex_tok_..." autocomplete="off">
        <div class="row">
          <button id="saveToken" class="button" type="button">Use token</button>
          <button id="clearToken" class="button ghost" type="button">Clear</button>
        </div>
        <p class="muted">Need one? Use <code>POST /texletter/api/signup</code> or your existing TEX token.</p>
      </div>
    </div>

    <script src="/texletter/app.js" type="module"></script>
  </body>
</html>
