# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name texflow.work www.texflow.work;
    return 301 https://texflow.work$request_uri;
}

# Main site (marketing)
server {
    listen 443 ssl http2;
    server_name texflow.work www.texflow.work;

    ssl_certificate /etc/letsencrypt/live/texflow.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/texflow.work/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

# Dashboard
server {
    listen 443 ssl http2;
    server_name dashboard.texflow.work;

    ssl_certificate /etc/letsencrypt/live/texflow.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/texflow.work/privkey.pem;

    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

# API
server {
    listen 443 ssl http2;
    server_name api.texflow.work;

    ssl_certificate /etc/letsencrypt/live/texflow.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/texflow.work/privkey.pem;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

    location / {
        limit_req zone=api_limit burst=20;
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
