version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: texflow
      POSTGRES_USER: texflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:-texflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
