<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>{{NAME}} · TexFlow</title>
<meta name="description" content="{{BLURB}}">
<meta name="application-name" content="{{NAME}}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{NAME}}">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f6f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0c0e" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta property="og:type" content="website">
<meta property="og:title" content="{{NAME}} — {{TAGLINE}}">
<meta property="og:description" content="{{BLURB}}">
<meta property="og:site_name" content="TexFlow">
<meta property="og:image" content="https://texflow.work/f/{{ID}}/card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<!-- Relative so the same file works at /f/<id>/ and at /s/<code>/. On a
     downloaded copy these simply are not there, which costs nothing: the file
     is already offline and already yours. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<!-- iOS reads only PNG here and reads it before anything else loads, so it is
     inlined: a file saved to Downloads still knows what it looks like. -->
<link rel="apple-touch-icon" href="{{ICON_DATA}}">
<style>{{CSS}}</style>
</head>
<body>
<div class="flow-app">
  <header class="flow-bar"></header>
  <main class="flow-main">
{{FLOW_HTML}}
  </main>
</div>
<script>window.FLOW_META={{META_JSON}};</script>
<script>{{RUNTIME}}</script>
<script>{{FLOW_JS}}</script>
</body>
</html>
