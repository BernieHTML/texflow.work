<!doctype html>
<html lang="en" style="--a1:{{A1}};--a2:{{A2}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>{{NAME}} · TexFlow</title>
<meta name="description" content="{{BLURB}}">
<meta name="application-name" content="{{NAME}}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{NAME}}">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f6f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0c0e" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta property="og:type" content="website">
<meta property="og:title" content="{{NAME}} — {{TAGLINE}}">
<meta property="og:description" content="{{BLURB}}">
<meta property="og:site_name" content="TexFlow">
<meta property="og:image" content="https://texflow.work/f/{{ID}}/card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<!-- The manifest is added by the runtime, and only when the Flow is being
     served over http(s). A downloaded copy has no directory to resolve it
     against, and a 404 on every open is not a thing to ship. -->
<link rel="icon" href="{{ICON_SVG}}" type="image/svg+xml">
<!-- iOS reads only PNG here and reads it before anything else loads, so it is
     inlined: a file saved to Downloads still knows what it looks like. -->
<link rel="apple-touch-icon" href="{{ICON_DATA}}">
<style>{{CSS}}</style>
</head>
<body>
<div class="flow-app">
  <!-- The chrome is written here at build time rather than assembled by the
       runtime. A Flow saved to a file and previewed somewhere that does not run
       scripts — the iOS Files app, most notably — then still shows its own name,
       its own mark and its own colour, and can say what to do about it. -->
  <header class="flow-bar">
    <span class="flow-mark-sm">{{MARK}}</span>
    <span class="flow-bar-title">{{NAME}}</span>
    <span class="flow-bar-spacer"></span>
    <button class="flow-icon-btn" id="flow-menu" type="button" aria-label="Menu">{{ICON_MORE}}</button>
  </header>
  <main class="flow-main">
    <noscript>
      <div class="flow-noscript">
        <h1>{{NAME}} needs JavaScript</h1>
        <p>Everything this Flow does happens on your device, in this page — so with
           scripts switched off there is nothing left of it but the name.</p>
        <p class="flow-noscript-why"><strong>Previewing a downloaded file?</strong>
           The iOS Files app shows HTML without running it. Open the file in a
           browser instead: from Safari's downloads list, or Share → open in a browser.</p>
        <p><a href="https://texflow.work/f/{{ID}}/">Or use it at texflow.work/f/{{ID}}</a></p>
      </div>
    </noscript>
{{FLOW_HTML}}
  </main>
</div>
<script>window.FLOW_META={{META_JSON}};</script>
<script>{{RUNTIME}}</script>
<script>{{FLOW_JS}}</script>
</body>
</html>
