
<style>
  #tracker-root { font-family: 'Courier New', monospace; background: #0a0e1a; color: #c8d8f0; border-radius: 12px; overflow: hidden; }
  #map { width: 100%; height: 520px; background: #0a0e1a; }
  #hud { display: flex; align-items: center; gap: 16px; padding: 10px 16px; background: #0d1220; border-bottom: 1px solid #1e2d50; flex-wrap: wrap; }
  #hud-title { font-size: 13px; font-weight: 700; letter-spacing: 0.12em; color: #4a9eff; text-transform: uppercase; flex-shrink: 0; }
  .stat { font-size: 11px; color: #6a88b8; }
  .stat span { color: #c8d8f0; font-weight: 700; }
  #status-dot { width: 8px; height: 8px; border-radius: 50%; background: #4a9eff; flex-shrink: 0; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  #refresh-btn { margin-left: auto; font-family: inherit; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; background: transparent; border: 1px solid #1e3a6a; color: #4a9eff; padding: 4px 12px; border-radius: 4px; cursor: pointer; }
  #refresh-btn:hover { background: #1e3a6a; }
  #sidebar { position: absolute; top: 0; right: 0; width: 260px; height: 100%; background: #0d1220ee; border-left: 1px solid #1e2d50; z-index: 500; transform: translateX(100%); transition: transform 0.2s; overflow-y: auto; padding: 16px; box-sizing: border-box; }
  #sidebar.open { transform: translateX(0); }
  #sidebar-close { float: right; background: none; border: none; color: #6a88b8; font-size: 18px; cursor: pointer; line-height: 1; }
  #sidebar h3 { font-size: 13px; color: #4a9eff; letter-spacing: 0.1em; text-transform: uppercase; margin: 0 0 12px; }
  .sb-row { display: flex; justify-content: space-between; margin: 6px 0; font-size: 12px; }
  .sb-label { color: #6a88b8; }
  .sb-val { color: #c8d8f0; font-weight: 600; }
  #error-msg { padding: 16px; font-size: 12px; color: #e24b4a; display: none; }
</style>

<div id="tracker-root" style="position:relative;">
  <div id="hud">
    <div id="status-dot"></div>
    <div id="hud-title">SYD/BMT Airspace</div>
    <div class="stat">Aircraft: <span id="ac-count">—</span></div>
    <div class="stat">Updated: <span id="last-update">—</span></div>
    <div class="stat">Radius: <span>120 nm</span></div>
    <button id="refresh-btn" onclick="fetchAircraft()">↻ Refresh</button>
  </div>
  <div style="position:relative; overflow:hidden;">
    <div id="map"></div>
    <div id="sidebar">
      <button id="sidebar-close" onclick="closeSidebar()">×</button>
      <h3 id="sb-callsign">—</h3>
      <div id="sb-content"></div>
    </div>
  </div>
  <div id="error-msg"></div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CENTRE_LAT = -33.87;
const CENTRE_LON = 151.21;
const RADIUS_NM  = 120;
const API = `https://api.airplanes.live/v2/point/${CENTRE_LAT}/${CENTRE_LON}/${RADIUS_NM}`;

const map = L.map('map', {
  center: [CENTRE_LAT, CENTRE_LON],
  zoom: 8,
  zoomControl: true,
  attributionControl: false
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '© OpenStreetMap © Carto',
  subdomains: 'abcd',
  maxZoom: 14
}).addTo(map);

L.control.attribution({ position: 'bottomleft', prefix: '© CartoDB | ADS-B: airplanes.live' }).addTo(map);

const airportIcon = L.divIcon({
  className: '',
  html: `<div style="width:10px;height:10px;border:2px solid #4a9eff;border-radius:50%;background:#1a2a4a;"></div>`,
  iconSize: [10,10], iconAnchor: [5,5]
});

L.marker([-33.9461, 151.1772], {icon: airportIcon}).addTo(map)
  .bindTooltip('YSSY — Kingsford Smith', {permanent: false, className: 'apt-tip', direction: 'right'});
L.marker([-33.7395, 150.3747], {icon: airportIcon}).addTo(map)
  .bindTooltip('Blue Mountains region', {permanent: false, className: 'apt-tip', direction: 'right'});
L.marker([-33.7272, 150.6389], {icon: airportIcon}).addTo(map)
  .bindTooltip('Penrith / Western Sydney', {permanent: false, className: 'apt-tip', direction: 'right'});

const style = document.createElement('style');
style.textContent = `.apt-tip{background:#0d1220;color:#4a9eff;border:1px solid #1e3a6a;font-family:monospace;font-size:11px;padding:3px 8px;border-radius:3px;}.leaflet-tooltip-left:before,.leaflet-tooltip-right:before{display:none;}`;
document.head.appendChild(style);

let markers = {};
let selectedHex = null;

function makeIcon(track, onGround, category) {
  const ang = track || 0;
  const col = onGround ? '#6a88b8' : category === 'A5' ? '#ffa040' : '#4af0a0';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" style="transform:rotate(${ang}deg);overflow:visible;">
    <polygon points="12,2 15,14 12,11 9,14" fill="${col}" opacity="0.95"/>
    <line x1="7" y1="10" x2="17" y2="10" stroke="${col}" stroke-width="1.5" opacity="0.7"/>
    <line x1="9" y1="14" x2="15" y2="14" stroke="${col}" stroke-width="1" opacity="0.5"/>
  </svg>`;
  return L.divIcon({ className: '', html: svg, iconSize: [24,24], iconAnchor: [12,12] });
}

function fmtAlt(v) {
  if (v === 'ground' || v === undefined || v === null) return 'On ground';
  return Number(v).toLocaleString() + ' ft';
}

function fmtSpd(v) { return v ? Math.round(v) + ' kts' : '—'; }
function fmtRate(v) { if (!v) return '—'; return (v > 0 ? '+' : '') + Math.round(v) + ' fpm'; }

function openSidebar(ac) {
  selectedHex = ac.hex;
  const sb = document.getElementById('sidebar');
  document.getElementById('sb-callsign').textContent = (ac.flight || ac.hex || '???').trim();
  document.getElementById('sb-content').innerHTML = `
    <div class="sb-row"><span class="sb-label">Hex</span><span class="sb-val">${ac.hex||'—'}</span></div>
    <div class="sb-row"><span class="sb-label">Registration</span><span class="sb-val">${ac.r||'—'}</span></div>
    <div class="sb-row"><span class="sb-label">Type</span><span class="sb-val">${ac.t||'—'}</span></div>
    <div class="sb-row"><span class="sb-label">Altitude</span><span class="sb-val">${fmtAlt(ac.alt_baro)}</span></div>
    <div class="sb-row"><span class="sb-label">Speed</span><span class="sb-val">${fmtSpd(ac.gs)}</span></div>
    <div class="sb-row"><span class="sb-label">Track</span><span class="sb-val">${ac.track ? Math.round(ac.track) + '°' : '—'}</span></div>
    <div class="sb-row"><span class="sb-label">V/S</span><span class="sb-val">${fmtRate(ac.baro_rate)}</span></div>
    <div class="sb-row"><span class="sb-label">Squawk</span><span class="sb-val">${ac.squawk||'—'}</span></div>
    <div class="sb-row"><span class="sb-label">Category</span><span class="sb-val">${ac.category||'—'}</span></div>
    <div class="sb-row"><span class="sb-label">Source</span><span class="sb-val">${ac.type||'—'}</span></div>
    ${ac.emergency && ac.emergency !== 'none' ? `<div class="sb-row" style="color:#e24b4a"><span class="sb-label">⚠ Emergency</span><span class="sb-val">${ac.emergency}</span></div>` : ''}
    <div style="margin-top:16px;font-size:11px;color:#3a6888;">
      <a href="https://globe.airplanes.live/?icao=${ac.hex}" target="_blank" style="color:#4a9eff;">View on airplanes.live ↗</a>
    </div>
  `;
  sb.classList.add('open');
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  selectedHex = null;
}

async function fetchAircraft() {
  const btn = document.getElementById('refresh-btn');
  btn.textContent = '↻ Loading…';
  btn.disabled = true;
  document.getElementById('error-msg').style.display = 'none';

  try {
    const res = await fetch(API);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const aircraft = data.ac || [];

    document.getElementById('ac-count').textContent = aircraft.length;
    document.getElementById('last-update').textContent = new Date().toLocaleTimeString('en-AU');

    const seen = new Set();
    for (const ac of aircraft) {
      if (!ac.lat || !ac.lon) continue;
      const hex = ac.hex;
      seen.add(hex);
      const icon = makeIcon(ac.track, ac.alt_baro === 'ground', ac.category);
      const label = (ac.flight || ac.r || hex || '').trim();
      const alt = fmtAlt(ac.alt_baro);
      const spd = fmtSpd(ac.gs);

      if (markers[hex]) {
        markers[hex].setLatLng([ac.lat, ac.lon]);
        markers[hex].setIcon(icon);
        markers[hex]._acData = ac;
      } else {
        const m = L.marker([ac.lat, ac.lon], { icon }).addTo(map);
        m._acData = ac;
        m.bindTooltip(
          `<b>${label}</b><br>${alt} · ${spd}`,
          { className: 'apt-tip', direction: 'top', offset: [0,-8] }
        );
        m.on('click', () => openSidebar(m._acData));
        markers[hex] = m;
      }

      if (selectedHex === hex) openSidebar(ac);
    }

    for (const hex of Object.keys(markers)) {
      if (!seen.has(hex)) { map.removeLayer(markers[hex]); delete markers[hex]; }
    }
  } catch (e) {
    const em = document.getElementById('error-msg');
    em.textContent = `Fetch error: ${e.message}. airplanes.live may be rate-limiting (1 req/s). Try again in a moment.`;
    em.style.display = 'block';
  }

  btn.textContent = '↻ Refresh';
  btn.disabled = false;
}

fetchAircraft();
setInterval(fetchAircraft, 15000);
</script>
