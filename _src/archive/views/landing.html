<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {{SEO}}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/ACSA/ACSA-Logo.jpg">
  <link rel="stylesheet" href="/ACSA/archive/assets/archive.css">
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="cursor-dot" aria-hidden="true"></div>
  <div class="cursor-ring" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand-link" href="/ACSA/" aria-label="ACSA home">
      <img class="brand-logo" src="/ACSA/ACSA-Logo.jpg" alt="Australian Crewed Spaceflight Agency logo">
      <span class="brand-text">
        <span class="brand-name">ACSA</span>
        <span class="brand-sub">Archive</span>
      </span>
    </a>
    <div class="topbar-actions">
      <button class="pill-btn" id="theme-toggle" type="button">Light mode</button>
      <a class="pill-link" href="/ACSA/">Back to ACSA</a>
    </div>
  </header>

  <main class="shell">
    <section class="archive-hero">
      <p class="archive-eyebrow">Australian Crewed Spaceflight Agency</p>
      <h1 class="archive-title">Archive</h1>
      <p class="archive-lede">A public archive of research papers, technical notes, and trade studies written by ACSA across spaceflight, propulsion, human factors, and vehicle design.</p>
      <div class="archive-search">
        <input id="archive-search-input" type="search" placeholder="Search by title, author, or tag..." aria-label="Search papers" autocomplete="off">
      </div>
    </section>

    <div class="paper-grid">
      {{CARDS}}
    </div>
  </main>

  <div id="copy-toast" class="copy-toast" role="status" aria-live="polite"></div>
  <script src="/ACSA/archive/assets/archive.js"></script>
</body>
</html>
