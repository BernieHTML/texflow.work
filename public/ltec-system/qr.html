<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan to try the LTEC model</title>
<meta name="description" content="QR code for the interactive LTEC model at texflow.work/ltec-system.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23070a12'/%3E%3Cpath d='M50 16a34 34 0 100 68 34 34 0 010-68z' fill='%2338bdf8'/%3E%3Cpath d='M50 16a34 34 0 010 68' fill='%23fbbf24'/%3E%3C/svg%3E">
<style>
/* A plain white board, sized to be screenshotted straight into a slide. No
   dark mode here on purpose: a dark QR panel dropped onto a light slide looks
   like a mistake, and projectors lose the contrast. */
:root { color-scheme: light; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: #ffffff;
  color: #0b1020;
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  display: flex; align-items: center; justify-content: center;
  padding: 32px;
}
.board { text-align: center; max-width: 760px; }
.caption {
  margin: 0 0 clamp(16px, 3vh, 28px);
  font-size: clamp(20px, 4.4vw, 34px); font-weight: 650; letter-spacing: -0.015em;
}
.code {
  width: min(62vh, 86vw, 540px); height: auto; display: block; margin: 0 auto;
  border: 1px solid #e3e8f0; border-radius: 12px;
}
.url {
  margin: clamp(16px, 3vh, 26px) 0 0;
  font: 600 clamp(17px, 3.4vw, 26px)/1.3 ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  letter-spacing: 0.01em; color: #0b1020; word-break: break-all;
}
.sub { margin: 10px 0 0; font-size: clamp(13px, 2.2vw, 16px); color: #5a6880; }
.back { position: fixed; top: 14px; left: 16px; font-size: 13px; color: #7a8599; text-decoration: none; }
.back:hover { color: #0b1020; }
@media print {
  .back { display: none; }
  body { padding: 0; }
}
</style>
</head>
<body>
<a class="back" href="/ltec-system">&larr; back to the model</a>
<div class="board">
  <p class="caption">Scan to try the model</p>
  <img class="code" src="/ltec-system/qr.svg" width="296" height="296"
       alt="QR code linking to texflow.work/ltec-system">
  <p class="url">texflow.work/ltec-system</p>
  <p class="sub">An interactive Lunar Thermal Energy Conversion model &mdash; move the sliders yourself.</p>
</div>
</body>
</html>
