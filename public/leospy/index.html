<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>
    // Cesium needs its base URL to load workers, assets and the star skybox.
    window.CESIUM_BASE_URL = 'https://cdn.jsdelivr.net/npm/cesium@1.118/Build/Cesium/';
  </script>
  <link rel="icon" href="/texflowlogo.png" type="image/png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.118/Build/Cesium/Widgets/widgets.css">
  <link rel="stylesheet" href="/leospy/styles.css">
<!-- SEO:BEGIN -->
  <title>LEOSpy | Live LEO Satellite Intelligence</title>
  <meta name="description" content="Track satellites in low Earth orbit worldwide with a live interactive globe and real-time orbital intelligence.">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <link rel="canonical" href="https://texflow.work/leospy">
  <meta property="og:title" content="LEOSpy | Live LEO Satellite Intelligence">
  <meta property="og:description" content="Track satellites in low Earth orbit worldwide with a live interactive globe and real-time orbital intelligence.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://texflow.work/leospy">
  <meta property="og:image" content="https://texflow.work/texflowlogo.png">
  <meta property="og:site_name" content="TexFlow">
  <meta property="og:locale" content="en_AU">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="LEOSpy | Live LEO Satellite Intelligence">
  <meta name="twitter:description" content="Track satellites in low Earth orbit worldwide with a live interactive globe and real-time orbital intelligence.">
  <meta name="twitter:image" content="https://texflow.work/texflowlogo.png">
<!-- SEO:END -->
</head>
<body>
  <div id="cesiumContainer" aria-label="Interactive 3D Earth globe with live satellites"></div>

  <!-- Loading -->
  <div id="loading" class="loading">
    <div class="loading-orb"></div>
    <p class="loading-title">LEOSpy</p>
    <p class="loading-sub" id="loading-status">Initialising orbital intelligence…</p>
  </div>

  <!-- Top bar -->
  <header class="topbar glass">
    <a class="brand" href="/leospy" aria-label="LEOSpy home">
      <span class="brand-dot"></span>
      <span class="brand-name">LEO<span class="brand-accent">Spy</span></span>
    </a>

    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21 20l-5.6-5.6a7 7 0 1 0-1.4 1.4L20 21zM5 10a5 5 0 1 1 10 0 5 5 0 0 1-10 0z"/></svg>
      <input id="search" type="search" autocomplete="off" placeholder="Search satellite, NORAD ID, operator…" aria-label="Search satellites">
      <div id="search-results" class="search-results" role="listbox" aria-label="Search results"></div>
    </div>

    <div class="topbar-stats">
      <span class="stat-pill"><span class="live-dot" id="live-dot"></span><span id="live-label">Live</span></span>
      <span class="stat-pill">Tracking <strong id="count-visible">0</strong></span>
      <span class="stat-pill source-pill" id="source-pill">Source: —</span>
    </div>
  </header>

  <!-- Left control panel -->
  <aside class="panel filters glass" aria-label="Layers and filters">
    <div class="panel-head">
      <h2>Layers</h2>
      <button class="ghost-btn" id="toggle-filters" aria-label="Collapse layers">–</button>
    </div>
    <div class="panel-body" id="filters-body">
      <div class="filter-list" id="filter-list"></div>

      <div class="divider"></div>

      <h3 class="panel-sub">Orbit path</h3>
      <div class="seg" id="orbit-seg" role="group" aria-label="Orbit path length">
        <button data-orbit="0" class="active">Off</button>
        <button data-orbit="1">1 orbit</button>
        <button data-orbit="3">3 orbits</button>
        <button data-orbit="24">24 h</button>
      </div>

      <label class="switch-row">
        <span>Live propagation</span>
        <input type="checkbox" id="live-toggle" checked>
        <span class="switch"></span>
      </label>
      <label class="switch-row">
        <span>Day / night lighting</span>
        <input type="checkbox" id="lighting-toggle" checked>
        <span class="switch"></span>
      </label>

      <div class="divider"></div>
      <button class="action-btn" id="locate-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9 3h-2.06A7 7 0 0 0 13 5.06V3h-2v2.06A7 7 0 0 0 5.06 11H3v2h2.06A7 7 0 0 0 11 18.94V21h2v-2.06A7 7 0 0 0 18.94 13H21z"/></svg>
        Satellites overhead
      </button>
    </div>
  </aside>

  <!-- Satellite detail panel -->
  <aside class="panel detail glass hidden" id="detail" aria-label="Satellite details">
    <button class="close-btn" id="detail-close" aria-label="Close details">×</button>
    <div class="detail-head">
      <span class="cat-chip" id="detail-cat">—</span>
      <span class="badge" id="detail-badge" hidden></span>
    </div>
    <h2 id="detail-name">—</h2>
    <p class="detail-id">NORAD <span id="detail-norad">—</span> · <span id="detail-country">—</span></p>

    <div class="detail-grid">
      <div class="metric"><span class="metric-label">Altitude</span><span class="metric-val" id="m-alt">—</span></div>
      <div class="metric"><span class="metric-label">Velocity</span><span class="metric-val" id="m-vel">—</span></div>
      <div class="metric"><span class="metric-label">Inclination</span><span class="metric-val" id="m-inc">—</span></div>
      <div class="metric"><span class="metric-label">Period</span><span class="metric-val" id="m-period">—</span></div>
      <div class="metric"><span class="metric-label">Latitude</span><span class="metric-val" id="m-lat">—</span></div>
      <div class="metric"><span class="metric-label">Longitude</span><span class="metric-val" id="m-lon">—</span></div>
      <div class="metric"><span class="metric-label">Type</span><span class="metric-val" id="m-type">—</span></div>
      <div class="metric"><span class="metric-label">Launched</span><span class="metric-val" id="m-launch">—</span></div>
    </div>

    <p class="overhead-line" id="m-overhead">Visibility: —</p>

    <div class="detail-actions">
      <button class="action-btn primary" id="follow-btn">Follow satellite</button>
      <button class="action-btn" id="flyto-btn">Fly to</button>
    </div>
  </aside>

  <!-- Overhead panel -->
  <aside class="panel overhead glass hidden" id="overhead" aria-label="Satellites overhead">
    <button class="close-btn" id="overhead-close" aria-label="Close overhead panel">×</button>
    <h2>Overhead right now</h2>
    <p class="overhead-sub" id="overhead-sub">Pinpointing your location…</p>
    <div class="overhead-list" id="overhead-list"></div>
  </aside>

  <!-- Hover tooltip -->
  <div id="tooltip" class="tooltip" hidden></div>

  <!-- Attribution / status -->
  <footer class="statusbar glass" id="statusbar">
    <span id="status-text">LEOSpy · Space-Track orbital data</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/cesium@1.118/Build/Cesium/Cesium.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/satellite.js@5.0.0/dist/satellite.min.js"></script>
  <script src="/leospy/app.js"></script>
</body>
</html>
