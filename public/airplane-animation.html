<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aeroplane Animation — TexFlow</title>
<style>
  :root {
    --sky-top: #0b1e3d;
    --sky-bottom: #1e4d8c;
    --sun: #ffd76a;
    --plane: #f4f6fb;
    --plane-accent: #ff5d5d;
    --cloud: rgba(255, 255, 255, 0.85);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  body {
    position: relative;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 65%, #2b6cb8 100%);
  }

  .sun {
    position: absolute;
    top: 8%;
    right: 12%;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--sun) 0%, rgba(255, 215, 106, 0) 70%);
    box-shadow: 0 0 60px 20px rgba(255, 215, 106, 0.35);
    animation: pulse 4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.9; }
    50% { transform: scale(1.08); opacity: 1; }
  }

  .stars {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 15%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 60% 8%, #fff, transparent),
      radial-gradient(1px 1px at 80% 20%, #fff, transparent),
      radial-gradient(1px 1px at 35% 25%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 90% 10%, #fff, transparent);
    opacity: 0.5;
  }

  .cloud {
    position: absolute;
    background: var(--cloud);
    border-radius: 50%;
    filter: blur(0.5px);
    opacity: 0.9;
  }

  .cloud::before, .cloud::after {
    content: "";
    position: absolute;
    background: var(--cloud);
    border-radius: 50%;
  }

  .cloud-1 { width: 90px; height: 34px; top: 22%; left: -20%; animation: drift 22s linear infinite; }
  .cloud-1::before { width: 50px; height: 50px; top: -22px; left: 10px; }
  .cloud-1::after  { width: 40px; height: 40px; top: -14px; left: 50px; }

  .cloud-2 { width: 130px; height: 44px; top: 55%; left: -25%; animation: drift 30s linear infinite; animation-delay: -8s; opacity: 0.75; }
  .cloud-2::before { width: 60px; height: 60px; top: -26px; left: 15px; }
  .cloud-2::after  { width: 50px; height: 50px; top: -18px; left: 70px; }

  .cloud-3 { width: 70px; height: 26px; top: 72%; left: -15%; animation: drift 18s linear infinite; animation-delay: -4s; opacity: 0.6; }
  .cloud-3::before { width: 36px; height: 36px; top: -16px; left: 8px; }
  .cloud-3::after  { width: 28px; height: 28px; top: -10px; left: 38px; }

  .cloud-4 { width: 100px; height: 36px; top: 12%; left: -22%; animation: drift 26s linear infinite; animation-delay: -14s; opacity: 0.55; }
  .cloud-4::before { width: 52px; height: 52px; top: -24px; left: 12px; }
  .cloud-4::after  { width: 42px; height: 42px; top: -16px; left: 55px; }

  @keyframes drift {
    from { transform: translateX(0); }
    to { transform: translateX(140vw); }
  }

  .plane-track {
    position: absolute;
    top: 42%;
    left: 0;
    width: 100%;
    animation: fly 9s ease-in-out infinite;
  }

  @keyframes fly {
    0%   { transform: translateX(-15vw) translateY(0) rotate(0deg); }
    25%  { transform: translateX(30vw) translateY(-40px) rotate(-3deg); }
    50%  { transform: translateX(65vw) translateY(0) rotate(0deg); }
    75%  { transform: translateX(95vw) translateY(-30px) rotate(3deg); }
    100% { transform: translateX(115vw) translateY(0) rotate(0deg); }
  }

  .plane {
    position: relative;
    width: 140px;
    height: 70px;
    animation: bob 1.6s ease-in-out infinite;
    filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.35));
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-6px) rotate(1deg); }
  }

  .trail {
    position: absolute;
    top: 50%;
    right: 100%;
    width: 220px;
    height: 3px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.7));
    transform: translateY(-50%);
    border-radius: 3px;
  }

  .propeller {
    position: absolute;
    left: 128px;
    top: 30px;
    width: 14px;
    height: 14px;
    border: 2px solid #ccc;
    border-radius: 50%;
    animation: spin 0.15s linear infinite;
    background:
      linear-gradient(#fff, #fff) center/2px 100% no-repeat,
      linear-gradient(90deg, #fff, #fff) center/100% 2px no-repeat;
    opacity: 0.85;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .ground {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 12%;
    background: linear-gradient(180deg, #163b26, #0d2417);
  }

  .caption {
    position: absolute;
    bottom: 4%;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.85);
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-align: center;
  }

  .caption strong {
    display: block;
    font-size: 22px;
    letter-spacing: 0.02em;
    text-transform: none;
    color: #fff;
    margin-bottom: 4px;
  }
</style>
</head>
<body>
  <div class="stars"></div>
  <div class="sun"></div>

  <div class="cloud cloud-1"></div>
  <div class="cloud cloud-2"></div>
  <div class="cloud cloud-3"></div>
  <div class="cloud cloud-4"></div>

  <div class="plane-track">
    <div class="plane">
      <div class="trail"></div>
      <svg viewBox="0 0 200 100" width="140" height="70" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="95" cy="55" rx="85" ry="10" fill="rgba(0,0,0,0.15)" />
        <path d="M20 50 Q 60 30 150 40 Q 190 42 195 50 Q 190 58 150 60 Q 60 70 20 50 Z" fill="#f4f6fb" stroke="#c9d3e0" stroke-width="1.5"/>
        <path d="M70 45 L30 15 L50 42 Z" fill="#dfe6f0" stroke="#c9d3e0" stroke-width="1.5"/>
        <path d="M75 60 L35 85 L55 58 Z" fill="#dfe6f0" stroke="#c9d3e0" stroke-width="1.5"/>
        <path d="M150 42 L185 22 L172 45 Z" fill="#ff5d5d" stroke="#d94b4b" stroke-width="1.5"/>
        <circle cx="110" cy="48" r="7" fill="#8ecbff" stroke="#5b9fe0" stroke-width="1.5"/>
        <circle cx="130" cy="49" r="6" fill="#8ecbff" stroke="#5b9fe0" stroke-width="1.5"/>
        <rect x="18" y="46" width="10" height="8" rx="2" fill="#ff5d5d"/>
      </svg>
      <div class="propeller"></div>
    </div>
  </div>

  <div class="ground"></div>

  <div class="caption">
    <strong>TexFlow</strong>
    cleared for takeoff
  </div>
</body>
</html>
