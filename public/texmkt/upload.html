<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publish to Agent Catalog — TexMKT · TexFlow</title>
  <link rel="icon" href="/texflowlogo.png" type="image/png">
  <link rel="stylesheet" href="/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="page">
    <header class="header">
      <a href="/" class="logo-wrap">
        <span class="logo-circle">
          <img src="/texflowlogo.png" alt="TexFlow" class="logo" width="48" height="48">
        </span>
        <span class="logo-text">TexFlow</span>
      </a>
      <nav class="nav">
        <a href="/texmkt/">TexMKT</a>
        <a href="/platform1/">Platform1</a>
        <a href="/texmkt/generate">Generate</a>
        <a href="/texmkt/upload">Publish</a>
        <a href="/texmkt/.well-known/ai.json" target="_blank" rel="noopener">AI</a>
      </nav>
    </header>

    <main class="page-content">
      <h1>Publish to Agent Catalog</h1>
      <p class="subtitle">Paste a valid Agent Appeal JSON below. It will be validated and stored; agents can discover it via <code>/texmkt/.well-known/agent-catalog.json</code> and read the full AA at <code>/texmkt/aa/:id</code>.</p>

      <div id="message" class="message" style="display: none;"></div>

      <form id="upload-form">
        <div class="form-group">
          <label for="aa-json">Agent Appeal JSON</label>
          <textarea id="aa-json" name="aa-json" placeholder='{"name":"...","type":"software",...}'></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submit-btn">Publish</button>
          <a href="/texmkt/generate" class="btn btn-secondary">Generate draft first</a>
          <a href="/texmkt/" class="btn btn-secondary">Home</a>
        </div>
      </form>
    </main>
  </div>
  <script>
    const API_BASE = '/texmkt/api';
    const messageEl = document.getElementById('message');
    const form = document.getElementById('upload-form');
    const aaJson = document.getElementById('aa-json');
    const submitBtn = document.getElementById('submit-btn');

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = 'message ' + (type === 'error' ? 'error' : 'success');
      messageEl.style.display = 'block';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      showMessage('', 'success');
      let obj;
      try {
        obj = JSON.parse(aaJson.value.trim());
      } catch {
        showMessage('Invalid JSON. Check syntax and try again.', 'error');
        return;
      }
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Publishing…';

      try {
        const res = await fetch(API_BASE + '/upload', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(obj)
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          showMessage(data.error || 'Upload failed', 'error');
          return;
        }
        showMessage('Published. Agent Appeal URL: ' + data.url, 'success');
        const link = document.createElement('a');
        link.href = data.url;
        link.textContent = 'View /texmkt/aa/' + data.id;
        link.className = 'btn btn-primary';
        link.style.marginTop = '1rem';
        messageEl.appendChild(document.createElement('br'));
        messageEl.appendChild(link);
      } catch (err) {
        showMessage(err.message || 'Network error', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Publish';
      }
    });
  </script>
  <script src="/app.js"></script>
</body>
</html>
