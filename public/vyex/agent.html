<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VyEx — Agent Guide | TexFlow</title>
  <meta name="description" content="How agents discover and use VyEx experts: catalog and preamble endpoints.">
  <link rel="icon" href="/texflowlogo.png" type="image/png">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/vyex/vyex.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .vyex-agent-page { padding: 2rem 1rem 4rem; max-width: 800px; margin: 0 auto; }
    .vyex-agent-page h1 { margin-top: 0; }
    .vyex-agent-page .vyex-agent-loading { color: var(--text-muted); }
    .vyex-agent-page .vyex-agent-error { color: #ef4444; }
    .vyex-agent-page .vyex-agent-body { line-height: 1.6; }
    .vyex-agent-page .vyex-agent-body h1 { font-size: 1.75rem; margin: 1.5em 0 0.5em; }
    .vyex-agent-page .vyex-agent-body h2 { font-size: 1.35rem; margin: 1.25em 0 0.5em; }
    .vyex-agent-page .vyex-agent-body h3 { font-size: 1.1rem; margin: 1em 0 0.4em; }
    .vyex-agent-page .vyex-agent-body p { margin: 0.5em 0; }
    .vyex-agent-page .vyex-agent-body ul, .vyex-agent-page .vyex-agent-body ol { margin: 0.5em 0; padding-left: 1.5rem; }
    .vyex-agent-page .vyex-agent-body code { background: var(--surface); padding: 0.15em 0.4em; border-radius: 4px; font-size: 0.9em; }
    .vyex-agent-page .vyex-agent-body pre { background: var(--surface); padding: 1rem; border-radius: 8px; overflow-x: auto; margin: 0.75em 0; }
    .vyex-agent-page .vyex-agent-body pre code { background: none; padding: 0; }
    .vyex-agent-page .vyex-agent-body table { border-collapse: collapse; width: 100%; margin: 0.75em 0; }
    .vyex-agent-page .vyex-agent-body th, .vyex-agent-page .vyex-agent-body td { border: 1px solid var(--border); padding: 0.5rem 0.75rem; text-align: left; }
    .vyex-agent-page .vyex-agent-body th { background: var(--surface); }
    .vyex-agent-page .vyex-agent-body hr { border: none; border-top: 1px solid var(--border); margin: 1.5em 0; }
    .vyex-agent-page .vyex-agent-body blockquote { border-left: 4px solid var(--accent); margin: 0.75em 0; padding-left: 1rem; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="page">
    <header class="header">
      <a href="/" class="logo-wrap">
        <span class="logo-circle"><img src="/texflowlogo.png" alt="TexFlow" class="logo" width="48" height="48"></span>
        <span class="logo-text">TexFlow</span>
      </a>
      <nav class="nav">
        <a href="/platform66/">Platform66</a>
        <a href="/vyex/">VyEx</a>
      </nav>
    </header>

    <main class="vy-page">
      <div class="vyex-agent-page">
        <p class="vy-muted" style="margin-bottom: 0.5rem;"><a href="/vyex/">VyEx</a> → Agent guide</p>
        <div id="vyex-agent-content">
          <p class="vyex-agent-loading">Loading guide…</p>
        </div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="/app.js"></script>
  <script>
    (function () {
      var container = document.getElementById('vyex-agent-content');
      if (!container) return;
      fetch('/.well-known/vyex.md')
        .then(function (r) { return r.ok ? r.text() : Promise.reject(new Error(r.status)); })
        .then(function (md) {
          if (typeof marked !== 'undefined') {
            marked.setOptions({ gfm: true, breaks: true });
            container.innerHTML = '<div class="vyex-agent-body">' + marked.parse(md) + '</div>';
          } else {
            container.innerHTML = '<pre class="vyex-agent-body">' + escapeHtml(md) + '</pre>';
          }
        })
        .catch(function () {
          container.innerHTML = '<p class="vyex-agent-error">Could not load the guide. You can fetch the raw markdown: <code>GET /.well-known/vyex.md</code></p>';
        });
      function escapeHtml(s) {
        var div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
      }
    })();
  </script>
  <script>
    (function () {
      var header = document.querySelector('.header');
      if (header) window.addEventListener('scroll', function () {
        header.classList.toggle('scrolled', window.scrollY > 20);
      });
    })();
  </script>
</body>
</html>
