<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generate Agent Appeal — TexFlow</title>
  <link rel="icon" href="/texflowlogo.png" type="image/png">
  <link rel="stylesheet" href="/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="page">
    <header class="header">
      <a href="/" class="logo-wrap">
        <span class="logo-circle">
          <img src="/texflowlogo.png" alt="TexFlow" class="logo" width="48" height="48">
        </span>
        <span class="logo-text">TexFlow</span>
      </a>
      <nav class="nav">
        <a href="/platform66/">Platform66</a>
        <a href="/vyex/">VyEx</a>
        <a href="/generate">Generate</a>
        <a href="/upload">Publish</a>
        <a href="/.well-known/ai.json" target="_blank" rel="noopener">AI</a>
      </nav>
    </header>

    <main class="page-content">
      <h1>Generate Agent Appeal</h1>
      <p class="subtitle">Enter a product or service URL. We’ll crawl the page with Crawl4AI and draft an Agent Appeal using Gemini. Edit the JSON below, then publish to the catalog.</p>

      <div id="message" class="message" style="display: none;"></div>

      <div id="step-url">
        <form id="url-form" class="form-group">
          <label for="url">Product / service URL</label>
          <input type="url" id="url" name="url" placeholder="https://example.com/product" required>
          <div id="status-container" class="status-container" style="display: none;">
            <p class="status-title">Live status</p>
            <ul id="status-log" class="status-log"></ul>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="submit-btn">Generate draft</button>
            <a href="/" class="btn btn-secondary">Back</a>
          </div>
        </form>
      </div>

      <div id="step-draft" style="display: none;">
        <div class="form-group">
          <label for="draft-json">Draft Agent Appeal (edit if needed)</label>
          <textarea id="draft-json" class="form-group"></textarea>
          <div class="form-actions">
            <button type="button" class="btn btn-primary" id="publish-btn">Publish to catalog</button>
            <button type="button" class="btn btn-secondary" id="new-draft-btn">New draft</button>
            <a href="/" class="btn btn-secondary">Home</a>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script>
    const messageEl = document.getElementById('message');
    const stepUrl = document.getElementById('step-url');
    const stepDraft = document.getElementById('step-draft');
    const urlForm = document.getElementById('url-form');
    const urlInput = document.getElementById('url');
    const draftJson = document.getElementById('draft-json');
    const submitBtn = document.getElementById('submit-btn');
    const publishBtn = document.getElementById('publish-btn');
    const newDraftBtn = document.getElementById('new-draft-btn');
    const statusContainer = document.getElementById('status-container');
    const statusLog = document.getElementById('status-log');

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = 'message ' + (type === 'error' ? 'error' : 'success');
      messageEl.style.display = 'block';
    }

    function hideMessage() {
      messageEl.style.display = 'none';
    }

    function addStatus(text) {
      statusContainer.style.display = 'block';
      const li = document.createElement('li');
      li.textContent = text;
      li.className = 'status-item';
      statusLog.appendChild(li);
      li.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function clearStatus() {
      statusLog.innerHTML = '';
      statusContainer.style.display = 'none';
    }

    urlForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessage();
      clearStatus();
      const url = urlInput.value.trim();
      if (!url) return;
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Generating…';

      try {
        const res = await fetch('/api/generate-draft', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          showMessage(data.error || 'Request failed', 'error');
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Generate draft';
          return;
        }
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const blocks = buf.split('\n\n');
          buf = blocks.pop() || '';
          for (const block of blocks) {
            let event = '';
            let data = '';
            for (const line of block.split('\n')) {
              if (line.startsWith('event:')) event = line.slice(6).trim();
              else if (line.startsWith('data:')) data = (data ? data + '\n' : '') + line.slice(5);
            }
            if (event === 'status') addStatus(data);
            else if (event === 'result') {
              try {
                const draft = JSON.parse(data);
                draftJson.value = JSON.stringify(draft, null, 2);
                stepUrl.style.display = 'none';
                stepDraft.style.display = 'block';
              } catch (_) {}
            } else if (event === 'error') showMessage(data || 'Generation failed', 'error');
          }
        }
        if (buf.trim()) {
          const blocks = buf.split('\n\n');
          for (const block of blocks) {
            let event = '', data = '';
            for (const line of block.split('\n')) {
              if (line.startsWith('event:')) event = line.slice(6).trim();
              else if (line.startsWith('data:')) data = (data ? data + '\n' : '') + line.slice(5);
            }
            if (event === 'result' && data) {
              try {
                const draft = JSON.parse(data);
                draftJson.value = JSON.stringify(draft, null, 2);
                stepUrl.style.display = 'none';
                stepDraft.style.display = 'block';
              } catch (_) {}
            }
          }
        }
      } catch (err) {
        showMessage(err.message || 'Network error', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Generate draft';
      }
    });

    newDraftBtn.addEventListener('click', () => {
      stepDraft.style.display = 'none';
      stepUrl.style.display = 'block';
      draftJson.value = '';
      clearStatus();
      hideMessage();
    });

    publishBtn.addEventListener('click', async () => {
      hideMessage();
      let obj;
      try {
        obj = JSON.parse(draftJson.value);
      } catch {
        showMessage('Invalid JSON. Fix the syntax and try again.', 'error');
        return;
      }
      publishBtn.disabled = true;
      publishBtn.innerHTML = '<span class="spinner"></span> Publishing…';

      try {
        const res = await fetch('/api/upload', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(obj)
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          showMessage(data.error || 'Upload failed', 'error');
          return;
        }
        showMessage('Published. View at: ' + data.url, 'success');
        const link = document.createElement('a');
        link.href = data.url;
        link.textContent = 'Open Agent Appeal';
        link.className = 'btn btn-primary';
        link.style.marginTop = '1rem';
        messageEl.appendChild(document.createElement('br'));
        messageEl.appendChild(link);
      } catch (err) {
        showMessage(err.message || 'Network error', 'error');
      } finally {
        publishBtn.disabled = false;
        publishBtn.innerHTML = 'Publish to catalog';
      }
    });
  </script>
  <script src="/app.js"></script>
</body>
</html>
