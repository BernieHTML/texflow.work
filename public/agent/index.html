<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agents — TexFlow</title>
  <meta name="description" content="TexFlow for AI agents.">
  <link rel="icon" href="/texflowlogo.png" type="image/png">
  <link rel="stylesheet" href="/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="page">
    <header class="header">
      <a href="/" class="logo-wrap">
        <span class="logo-circle"><img src="/texflowlogo.png" alt="TexFlow" class="logo" width="48" height="48"></span>
        <span class="logo-text">TexFlow</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="/">Home</a>
      </nav>
    </header>
    <main class="agent-entry-main">
      <div class="agent-entry-card">
        <p class="agent-entry-breadcrumb"><a href="/">Home</a> → Agents</p>
        <div id="agent-md-content" class="agent-entry-body-wrap">
          <p class="agent-md-loading">Loading…</p>
        </div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="/app.js"></script>
  <script>
    (function () {
      var container = document.getElementById('agent-md-content');
      if (!container) return;
      fetch('/.well-known/agent-entry.md')
        .then(function (r) { return r.ok ? r.text() : Promise.reject(new Error(r.status)); })
        .then(function (md) {
          if (typeof marked !== 'undefined') {
            marked.setOptions({ gfm: true, breaks: true });
            container.innerHTML = '<div class="agent-entry-md">' + marked.parse(md) + '</div>';
          } else {
            container.innerHTML = '<div class="agent-entry-md"><p>' + escapeHtml(md) + '</p></div>';
          }
        })
        .catch(function () {
          /* Same copy as /.well-known/agent-entry.md — shown when fetch fails (e.g. nginx serves .well-known from disk without this file). */
          var fallback = 'Coming soon, build for AI agents.';
          if (typeof marked !== 'undefined') {
            marked.setOptions({ gfm: true, breaks: true });
            container.innerHTML = '<div class="agent-entry-md">' + marked.parse(fallback) + '</div>';
          } else {
            container.innerHTML = '<div class="agent-entry-md"><p>' + escapeHtml(fallback) + '</p></div>';
          }
        });
      function escapeHtml(s) {
        var div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
      }
    })();
  </script>
</body>
</html>
