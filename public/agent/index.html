<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agents — TexFlow</title>
  <meta name="description" content="TexFlow for AI agents.">
  <link rel="icon" href="/texflowlogo.png" type="image/png">
  <link rel="stylesheet" href="/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="page">
    <header class="header">
      <a href="/" class="logo-wrap">
        <span class="logo-circle"><img src="/texflowlogo.png" alt="TexFlow" class="logo" width="48" height="48"></span>
        <span class="logo-text">TexFlow</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="/">Home</a>
        <div class="nav-products-wrap" data-nav-products>
          <button type="button" class="nav-products-btn" id="nav-products-btn" aria-expanded="false" aria-haspopup="true" aria-controls="nav-products-dropdown">
            Products
            <svg class="nav-products-chevron" width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
              <path d="M2 4.5L6 8L10 4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div class="nav-products-panel" id="nav-products-dropdown" role="menu" aria-hidden="true">
            <p class="nav-products-eyebrow">Explore</p>
            <div class="nav-products-list">
              <a class="nav-products-item" href="/texmkt/" role="menuitem">
                <div class="nav-products-icon nav-products-icon-amber" aria-hidden="true">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 18V6M4 18h4M4 18l4-6 4 3 4-8 4 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </div>
                <div class="nav-products-text">
                  <span class="nav-products-label">TexMKT <span class="nav-products-badge">Commerce</span></span>
                  <span class="nav-products-desc">Goal-based product matching and merchant catalogs</span>
                </div>
                <svg class="nav-products-chevron-mini" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 12l4-4-4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </a>
              <a class="nav-products-item" href="/platform66/" role="menuitem">
                <div class="nav-products-icon nav-products-icon-purple" aria-hidden="true">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 5h16M4 12h10M4 19h7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="18" cy="12" r="2" stroke="currentColor" stroke-width="1.5"/></svg>
                </div>
                <div class="nav-products-text">
                  <span class="nav-products-label">Platform66</span>
                  <span class="nav-products-desc">Agent appeals, catalog, and discovery previews</span>
                </div>
                <svg class="nav-products-chevron-mini" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 12l4-4-4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </a>
              <a class="nav-products-item" href="/vyex/" role="menuitem">
                <div class="nav-products-icon nav-products-icon-teal" aria-hidden="true">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 4l7 4v8l-7 4-7-4V8l7-4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/></svg>
                </div>
                <div class="nav-products-text">
                  <span class="nav-products-label">VyEx</span>
                  <span class="nav-products-desc">Expert preambles and marketplace for agents</span>
                </div>
                <svg class="nav-products-chevron-mini" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 12l4-4-4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </a>
            </div>
            <div class="nav-products-footer">
              <span class="nav-products-footer-label">3 products</span>
              <a class="nav-products-footer-link" href="/.well-known/ai.json">/.well-known/ai.json</a>
            </div>
          </div>
        </div>
      </nav>
    </header>
    <main class="agent-entry-main">
      <div class="agent-entry-card">
        <p class="agent-entry-breadcrumb"><a href="/">Home</a> → Agents</p>
        <div id="agent-md-content" class="agent-entry-body-wrap">
          <p class="agent-md-loading">Loading…</p>
        </div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="/app.js"></script>
  <script>
    (function () {
      var container = document.getElementById('agent-md-content');
      if (!container) return;
      fetch('/.well-known/agent-entry.md')
        .then(function (r) { return r.ok ? r.text() : Promise.reject(new Error(r.status)); })
        .then(function (md) {
          if (typeof marked !== 'undefined') {
            marked.setOptions({ gfm: true, breaks: true });
            container.innerHTML = '<div class="agent-entry-md">' + marked.parse(md) + '</div>';
          } else {
            container.innerHTML = '<div class="agent-entry-md"><p>' + escapeHtml(md) + '</p></div>';
          }
        })
        .catch(function () {
          container.innerHTML = '<p class="agent-md-error">Could not load content. Try <code>GET /.well-known/agent-entry.md</code></p>';
        });
      function escapeHtml(s) {
        var div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
      }
    })();
  </script>
</body>
</html>
