<style>/* The look every Flow inherits.
 *
 * One rule governs everything here: a Flow has to feel the same opened from a
 * home-screen icon, from a link in a message, and from a file sitting in
 * Downloads with no network at all. So there are no web fonts, no external
 * stylesheets and no images — the accent is the two colours from the Flow's
 * own icon, injected as --a1/--a2, and everything else is drawn with CSS.
 */

:root {
  --a1: #0369a1;
  --a2: #38bdf8;

  --bg: #f6f6f7;
  --bg-deep: #eeeef1;
  --surface: #ffffff;
  --surface-2: #fafafb;
  --line: rgba(9, 9, 11, 0.09);
  --line-strong: rgba(9, 9, 11, 0.16);
  --ink: #18181b;
  --ink-2: #52525b;
  --ink-3: #8b8b95;
  --danger: #dc2626;
  --good: #15803d;

  --shadow-1: 0 1px 2px rgba(9, 9, 11, 0.04), 0 1px 3px rgba(9, 9, 11, 0.05);
  --shadow-2: 0 2px 6px rgba(9, 9, 11, 0.05), 0 12px 28px rgba(9, 9, 11, 0.09);
  --shadow-3: 0 10px 40px rgba(9, 9, 11, 0.18);

  --r-sm: 10px;
  --r: 14px;
  --r-lg: 20px;
  --r-xl: 26px;

  --pad: 18px;
  --tap: 48px;
  --header: 56px;

  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  --ease: cubic-bezier(0.32, 0.72, 0, 1);
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0c0c0e;
    --bg-deep: #08080a;
    --surface: #17171a;
    --surface-2: #1e1e22;
    --line: rgba(255, 255, 255, 0.09);
    --line-strong: rgba(255, 255, 255, 0.18);
    --ink: #f4f4f5;
    --ink-2: #a1a1aa;
    --ink-3: #71717a;
    --danger: #f87171;
    --good: #4ade80;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow-2: 0 2px 6px rgba(0, 0, 0, 0.4), 0 12px 28px rgba(0, 0, 0, 0.5);
    --shadow-3: 0 10px 40px rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overscroll-behavior-y: none;
}

body {
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.45;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  text-size-adjust: 100%;
  -webkit-text-size-adjust: 100%;
}

button, input, select, textarea { font: inherit; color: inherit; }
input, textarea, select { -webkit-appearance: none; appearance: none; }
h1, h2, h3, h4, p, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }
a { color: var(--a1); }
@media (prefers-color-scheme: dark) { a { color: var(--a2); } }

/* ------------------------------------------------------------------ layout */

.flow-app {
  display: flex;
  flex-direction: column;
  min-height: 100%;
  min-height: 100dvh;
}

.flow-bar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 10px;
  height: calc(var(--header) + env(safe-area-inset-top));
  padding: env(safe-area-inset-top) max(var(--pad), env(safe-area-inset-left)) 0 max(var(--pad), env(safe-area-inset-right));
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: saturate(1.6) blur(16px);
  -webkit-backdrop-filter: saturate(1.6) blur(16px);
  border-bottom: 1px solid transparent;
  transition: border-color 0.2s;
}
.flow-bar.is-stuck { border-bottom-color: var(--line); }

/* One inline SVG, sized by whoever is showing it. */
.flow-mark { display: block; width: 100%; height: 100%; }
.flow-mark-sm { flex: none; display: block; width: 28px; height: 28px; }
.flow-mark-lg { display: block; width: 78px; height: 78px; margin: 6px auto 15px; filter: drop-shadow(0 8px 22px rgba(9, 9, 11, 0.2)); }

.flow-bar-title {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.flow-bar-spacer { flex: 1; }

.flow-icon-btn {
  flex: none;
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--ink-2);
  cursor: pointer;
  transition: background 0.15s, color 0.15s, transform 0.15s var(--ease);
}
.flow-icon-btn:hover { background: var(--line); color: var(--ink); }
.flow-icon-btn:active { transform: scale(0.9); }
.flow-icon-btn svg { width: 21px; height: 21px; }

.flow-main {
  flex: 1;
  width: 100%;
  max-width: 680px;
  margin: 0 auto;
  padding: 12px max(var(--pad), env(safe-area-inset-left)) calc(40px + env(safe-area-inset-bottom)) max(var(--pad), env(safe-area-inset-right));
  display: flex;
  flex-direction: column;
}

/* A dock that stays put at the bottom of the viewport for the one action a
 * Flow is really about — Start, Add, Settle up. */
.flow-dock {
  position: sticky;
  bottom: 0;
  z-index: 30;
  /* `auto` rather than a fixed gap: on a short page the action sits at the
     bottom of the screen where a thumb is, and on a long one it rides the
     scroll instead of running away up the page. */
  margin: 16px calc(var(--pad) * -1) 0;
  margin-top: auto;
  padding: 12px var(--pad) calc(12px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--bg) 62%, transparent);
}

/* ------------------------------------------------------------- typography */

.flow-lede {
  color: var(--ink-2);
  font-size: 15px;
  margin-bottom: 18px;
}

.flow-label {
  display: block;
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin: 0 0 8px 2px;
}

.flow-section { margin-top: 26px; }
.flow-section:first-child { margin-top: 6px; }

.flow-hint { font-size: 13px; color: var(--ink-3); margin-top: 8px; }

.flow-empty {
  text-align: center;
  padding: 44px 20px;
  color: var(--ink-3);
  font-size: 15px;
}
.flow-empty strong { display: block; color: var(--ink-2); font-weight: 600; margin-bottom: 4px; }

.num { font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------- surfaces */

.flow-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-1);
  padding: 16px;
}
.flow-card + .flow-card { margin-top: 12px; }

.flow-tile {
  border-radius: var(--r-xl);
  padding: 22px 20px;
  color: #fff;
  background: linear-gradient(135deg, var(--a1), var(--a2));
  box-shadow: var(--shadow-2);
}
.flow-tile .flow-tile-value {
  font-size: clamp(38px, 13vw, 56px);
  font-weight: 680;
  letter-spacing: -0.035em;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.flow-tile .flow-tile-label {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  opacity: 0.78;
  margin-bottom: 10px;
}
.flow-tile .flow-tile-note { font-size: 14px; opacity: 0.86; margin-top: 8px; }

/* --------------------------------------------------------------- controls */

.flow-field { margin-bottom: 14px; }

.flow-input, .flow-select, .flow-textarea {
  width: 100%;
  min-height: var(--tap);
  padding: 12px 14px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r);
  background: var(--surface);
  color: var(--ink);
  font-size: 16px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.flow-textarea { min-height: 120px; resize: vertical; line-height: 1.5; }
.flow-input:focus, .flow-select:focus, .flow-textarea:focus {
  outline: none;
  border-color: var(--a2);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--a2) 22%, transparent);
}
.flow-input::placeholder, .flow-textarea::placeholder { color: var(--ink-3); }
.flow-input[inputmode="decimal"], .flow-input[type="number"] { font-variant-numeric: tabular-nums; }

.flow-select {
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
  background-position: calc(100% - 19px) 50%, calc(100% - 13px) 50%;
  background-size: 6px 6px, 6px 6px;
  background-repeat: no-repeat;
  padding-right: 38px;
}

.flow-row { display: flex; gap: 10px; }
.flow-row > * { flex: 1; min-width: 0; }

.flow-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  min-height: 52px;
  padding: 0 20px;
  border: 0;
  border-radius: var(--r);
  background: linear-gradient(135deg, var(--a1), var(--a2));
  color: #fff;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.01em;
  cursor: pointer;
  box-shadow: var(--shadow-1);
  transition: transform 0.16s var(--ease), filter 0.16s, opacity 0.16s;
}
.flow-btn:active { transform: scale(0.975); filter: brightness(0.95); }
.flow-btn[disabled] { opacity: 0.4; pointer-events: none; }
.flow-btn svg { width: 19px; height: 19px; }

.flow-btn.is-quiet {
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--line-strong);
  box-shadow: none;
}
.flow-btn.is-ghost { background: none; color: var(--ink-2); box-shadow: none; font-weight: 550; }
.flow-btn.is-danger { background: none; color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent); box-shadow: none; }
.flow-btn.is-small { min-height: 40px; font-size: 14px; padding: 0 14px; width: auto; }

/* A row of mutually exclusive choices. */
.flow-segment {
  display: flex;
  gap: 3px;
  padding: 3px;
  background: var(--bg-deep);
  border-radius: var(--r);
  border: 1px solid var(--line);
}
.flow-segment button {
  flex: 1;
  min-width: 0;
  min-height: 40px;
  padding: 0 10px;
  border: 0;
  border-radius: 11px;
  background: transparent;
  color: var(--ink-2);
  font-size: 14px;
  font-weight: 560;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: background 0.18s var(--ease), color 0.18s, box-shadow 0.18s;
}
.flow-segment button[aria-pressed="true"] {
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow-1);
}

/* Chips: filters, tags, quick picks. */
.flow-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.flow-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
  padding: 0 13px;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink-2);
  font-size: 14px;
  font-weight: 550;
  cursor: pointer;
  transition: all 0.16s var(--ease);
}
.flow-chip:active { transform: scale(0.95); }
.flow-chip[aria-pressed="true"], .flow-chip.is-on {
  background: linear-gradient(135deg, var(--a1), var(--a2));
  border-color: transparent;
  color: #fff;
}

/* Stepper for counts that people nudge rather than type. */
.flow-stepper {
  display: flex;
  align-items: center;
  gap: 2px;
  background: var(--bg-deep);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 3px;
}
.flow-stepper button {
  width: 42px;
  height: 42px;
  border: 0;
  border-radius: 11px;
  background: var(--surface);
  color: var(--ink);
  font-size: 21px;
  font-weight: 500;
  cursor: pointer;
  box-shadow: var(--shadow-1);
  transition: transform 0.12s var(--ease);
}
.flow-stepper button:active { transform: scale(0.9); }
.flow-stepper output {
  flex: 1;
  text-align: center;
  font-size: 17px;
  font-weight: 620;
  font-variant-numeric: tabular-nums;
}

.flow-check {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: var(--tap);
  padding: 4px 2px;
  cursor: pointer;
}
.flow-check input { position: absolute; opacity: 0; pointer-events: none; }
.flow-check .box {
  flex: none;
  width: 25px;
  height: 25px;
  border: 2px solid var(--line-strong);
  border-radius: 8px;
  display: grid;
  place-items: center;
  transition: all 0.18s var(--ease);
}
.flow-check .box svg { width: 15px; height: 15px; stroke: #fff; opacity: 0; transform: scale(0.6); transition: all 0.18s var(--ease); }
.flow-check input:checked + .box { background: linear-gradient(135deg, var(--a1), var(--a2)); border-color: transparent; }
.flow-check input:checked + .box svg { opacity: 1; transform: scale(1); }
.flow-check input:checked ~ .txt { color: var(--ink-3); text-decoration: line-through; }
.flow-check .txt { transition: color 0.18s; }

/* ------------------------------------------------------------------ lists */

.flow-list { border-radius: var(--r-lg); overflow: hidden; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow-1); }
.flow-list > li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); }
.flow-list > li:first-child { border-top: 0; }
.flow-list .grow { flex: 1; min-width: 0; }
.flow-list .name { font-weight: 560; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flow-list .sub { font-size: 13px; color: var(--ink-3); }
.flow-list .val { font-variant-numeric: tabular-nums; font-weight: 620; }

.flow-x {
  flex: none;
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--ink-3);
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.flow-x:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }
.flow-x svg { width: 16px; height: 16px; }

/* ---------------------------------------------------------------- overlays */

.flow-scrim {
  position: fixed;
  inset: 0;
  z-index: 90;
  background: rgba(9, 9, 11, 0.42);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  opacity: 0;
  transition: opacity 0.28s var(--ease);
}
.flow-scrim.is-open { opacity: 1; }

.flow-sheet {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 91;
  max-height: 88dvh;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 10px max(16px, env(safe-area-inset-left)) calc(16px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-right));
  background: var(--surface);
  border-radius: 26px 26px 0 0;
  box-shadow: var(--shadow-3);
  transform: translateY(100%);
  transition: transform 0.36s var(--ease);
}
.flow-sheet.is-open { transform: translateY(0); }
@media (min-width: 620px) {
  .flow-sheet {
    left: 50%;
    right: auto;
    bottom: 50%;
    width: 440px;
    max-width: calc(100vw - 32px);
    border-radius: 24px;
    transform: translate(-50%, 60%) scale(0.96);
    opacity: 0;
    transition: transform 0.3s var(--ease), opacity 0.3s var(--ease);
  }
  .flow-sheet.is-open { transform: translate(-50%, 50%); opacity: 1; }
}

.flow-grip { width: 38px; height: 4px; border-radius: 2px; background: var(--line-strong); margin: 2px auto 12px; }
@media (min-width: 620px) { .flow-grip { display: none; } }

.flow-sheet h2 { font-size: 19px; font-weight: 650; letter-spacing: -0.02em; margin: 0 4px 4px; }
.flow-sheet .sheet-lede { font-size: 14.5px; color: var(--ink-2); margin: 0 4px 14px; }

.flow-menu { display: flex; flex-direction: column; gap: 2px; }
.flow-menu button {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  min-height: 54px;
  padding: 0 12px;
  border: 0;
  border-radius: var(--r);
  background: transparent;
  color: var(--ink);
  font-size: 16px;
  font-weight: 520;
  text-align: left;
  cursor: pointer;
  transition: background 0.14s;
}
.flow-menu button:hover { background: var(--surface-2); }
.flow-menu button:active { background: var(--bg-deep); }
.flow-menu button .mi {
  flex: none;
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  background: var(--bg-deep);
  color: var(--ink-2);
}
.flow-menu button .mi svg { width: 18px; height: 18px; }
.flow-menu button .mt { flex: 1; min-width: 0; }
.flow-menu button .ms { display: block; font-size: 12.5px; font-weight: 400; color: var(--ink-3); margin-top: 1px; }
.flow-menu button.is-accent .mi { background: linear-gradient(135deg, var(--a1), var(--a2)); color: #fff; }
.flow-menu button.is-danger { color: var(--danger); }
.flow-menu button.is-danger .mi { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }
.flow-menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 12px; }

/* Toast */
.flow-toasts {
  position: fixed;
  left: 50%;
  bottom: calc(22px + env(safe-area-inset-bottom));
  z-index: 95;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  pointer-events: none;
  width: max-content;
  max-width: calc(100vw - 32px);
}
.flow-toast {
  padding: 11px 18px;
  border-radius: 999px;
  background: #18181b;
  color: #fafafa;
  font-size: 14.5px;
  font-weight: 520;
  box-shadow: var(--shadow-2);
  animation: flow-toast-in 0.32s var(--ease);
}
@media (prefers-color-scheme: dark) { .flow-toast { background: #f4f4f5; color: #18181b; } }
.flow-toast.is-out { animation: flow-toast-out 0.26s var(--ease) forwards; }
@keyframes flow-toast-in { from { opacity: 0; transform: translateY(14px) scale(0.94); } }
@keyframes flow-toast-out { to { opacity: 0; transform: translateY(10px) scale(0.96); } }

/* The Add-to-Home-Screen coach. */
.flow-coach { text-align: center; padding: 6px 6px 2px; }
.flow-coach h2 { text-align: center; }
.flow-coach .sheet-lede { text-align: center; }
.flow-steps { display: flex; flex-direction: column; gap: 10px; margin: 16px 0 18px; text-align: left; }
.flow-steps li {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--r);
  font-size: 15px;
}
.flow-steps .n {
  flex: none;
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--a1), var(--a2));
  color: #fff;
  font-size: 13px;
  font-weight: 650;
}
.flow-steps svg { width: 18px; height: 18px; vertical-align: -4px; margin: 0 2px; }

/* What a Flow looks like where scripts do not run — the iOS Files preview,
 * most of all. Without this it is an empty page under a title bar, which reads
 * as broken rather than as "open me somewhere that can run me". */
.flow-noscript {
  margin: 22px 0;
  padding: 24px 22px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-1);
}
.flow-noscript h1 { font-size: 21px; font-weight: 640; letter-spacing: -0.025em; margin-bottom: 10px; }
.flow-noscript p { color: var(--ink-2); font-size: 15.5px; margin-bottom: 12px; }
.flow-noscript p:last-child { margin-bottom: 0; }
.flow-noscript-why {
  padding: 13px 15px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--r);
}
.flow-noscript-why strong { color: var(--ink); }

.flow-remove h2 { text-align: center; margin-bottom: 14px; }
.flow-remove .flow-steps { margin-bottom: 4px; }

/* The screen a deleted Flow leaves behind. */
.flow-gone {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  min-height: 100dvh;
  padding: 32px;
  text-align: center;
}
.flow-gone .flow-mark-lg { width: 72px; height: 72px; filter: grayscale(1); opacity: 0.32; }
.flow-gone h1 { font-size: 22px; font-weight: 650; letter-spacing: -0.02em; }
.flow-gone p { color: var(--ink-2); max-width: 32ch; }
.flow-gone .flow-btn { margin-top: 4px; }

.flow-hidden { display: none !important; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}


/* ---- Pace ---- */
.pc-clock { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.pc-clock .cell { position: relative; }
.pc-clock input {
  width: 100%;
  min-height: 58px;
  padding: 18px 12px 6px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r);
  background: var(--surface);
  color: var(--ink);
  font-size: 21px;
  font-weight: 620;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.pc-clock input:focus { outline: none; border-color: var(--a2); box-shadow: 0 0 0 4px color-mix(in srgb, var(--a2) 22%, transparent); }
.pc-clock .cap {
  position: absolute;
  top: 6px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 10px;
  font-weight: 650;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--ink-3);
  pointer-events: none;
}

.pc-dist { display: grid; grid-template-columns: 1fr 110px; gap: 8px; }

.pc-splits li { font-variant-numeric: tabular-nums; }
.pc-splits .k { width: 58px; color: var(--ink-3); font-size: 14px; }
.pc-splits .fast { color: var(--good); }

.pc-solve { margin-bottom: 16px; }</style>

        gain.gain.linearRampToValueAtTime(o.volume === undefined ? 0.22 : o.volume, t + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + (o.length || 0.14));
        osc.connect(gain).connect(ctx.destination);
        osc.start(t);
        osc.stop(t + (o.length || 0.14) + 0.02);
      })(i);
    }
  }

  // ------------------------------------------------------------ screen lock ---

  // Timers are the one thing a Flow does that the phone actively works against.
  // Where the API exists it is used; where it does not, the Flow still counts
  // down correctly against the clock, it just does it behind a dark screen.
  var wakeLock = null;
  function keepAwake(on) {
    if (!navigator.wakeLock) return;
    if (!on) {
      if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
      return;
    }
    if (wakeLock) return;
    navigator.wakeLock.request('screen').then(function (lock) {
      wakeLock = lock;
      lock.addEventListener('release', function () { wakeLock = null; });
    }).catch(function () {});
  }
  // iOS drops the lock whenever the app goes to the background; take it back.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && wakeLockWanted) keepAwake(true);
  });
  var wakeLockWanted = false;

  // ----------------------------------------------------------------- files ---

  function saveBlob(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = h('a', { href: url, download: filename, style: { display: 'none' } });
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { a.remove(); URL.revokeObjectURL(url); }, 4000);
  }

  function pickFile(accept) {
    return new Promise(function (resolve) {
      var input = h('input', { type: 'file', accept: accept || '.json,application/json', style: { display: 'none' } });
      input.addEventListener('change', function () {
        var f = input.files && input.files[0];
        input.remove();
        if (!f) return resolve(null);
        var reader = new FileReader();
        reader.onload = function () { resolve(String(reader.result)); };
        reader.onerror = function () { resolve(null); };
        reader.readAsText(f);
      });
      document.body.appendChild(input);
      input.click();
    });
  }

  var slug = function (s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); };

  // The file, optionally with the current data baked into it — so a copy opens
  // on the same shopping list you were just looking at.
  function flowHtml(withData) {
    if (!withData) return PRISTINE;
    var seed = '<script id="flow-seed" type="application/json">'
      + JSON.stringify(store.all()).replace(/<\//g, '<\\/')
      + '<\/script>';
    return PRISTINE.indexOf('</head>') > -1
      ? PRISTINE.replace('</head>', seed + '\n</head>')
      : seed + PRISTINE;
  }

  var fileName = function () { return (META.name || 'flow') + '.html'; };

  function saveFile(withData) {
    saveBlob(new Blob([flowHtml(withData)], { type: 'text/html' }), fileName());
  }

  // Handing the whole app over as a file, through the operating system's own
  // share sheet — which on an iPhone or a Mac means AirDrop. Two phones in a
  // room with no signal between them can still pass a Flow across, and what
  // lands is the working tool rather than a link to one.
  function fileFor(withData) {
    try {
      return new File([flowHtml(withData)], fileName(), { type: 'text/html' });
    } catch (e) {
      return null;
    }
  }

  function canSendFile() {
    if (!navigator.share || !navigator.canShare) return false;
    var probe = fileFor(false);
    if (!probe) return false;
    try { return navigator.canShare({ files: [probe] }); } catch (e) { return false; }
  }

  function sendFile(withData) {
    var file = fileFor(withData);
    if (!file) return saveFile(withData);
    navigator.share({
      files: [file],
      title: META.name,
      text: META.name + ' — a TexFlow tool. Open it in a browser; it needs nothing else.'
    }).catch(function (e) {
      // A cancelled share sheet is not a failure, and should not become one.
      if (e && e.name === 'AbortError') return;
      saveFile(withData);
      toast('Shared it as a download instead');
    });
  }

  // A file downloaded "with my data" carries a seed block. It is lifted out of
  // the document *before* PRISTINE is captured — otherwise re-saving the file
  // would bake a second, staler seed in beside the first — and applied only
  // once, so re-opening the file never overwrites work done since.
  function takeSeed() {
    var node = document.getElementById('flow-seed');
    if (!node) return null;
    var text = node.textContent || '';
    node.remove();
    return text;
  }

  function applySeed(text) {
    if (!text || store.get('__seeded', false)) return;
    try {
      var data = JSON.parse(text);
      Object.keys(data).forEach(function (k) { if (k !== '__seeded') store.set(k, data[k]); });
    } catch (e) {}
    store.set('__seeded', true);
  }

  function exportData() {
    var payload = { flow: META.id, name: META.name, exported: new Date().toISOString(), data: store.all() };
    saveBlob(new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }), slug(META.name || 'flow') + '-data.json');
    toast('Saved to your files');
  }

  function importData() {
    pickFile().then(function (text) {
      if (!text) return;
      var parsed;
      try { parsed = JSON.parse(text); } catch (e) { return toast('That file is not a Flow backup'); }
      var data = parsed && parsed.data ? parsed.data : parsed;
      if (parsed && parsed.flow && parsed.flow !== META.id) {
        return toast('That backup is for ' + (parsed.name || parsed.flow));
      }
      confirm({
        title: 'Replace what is here?',
        lede: 'Everything currently in ' + META.name + ' on this device will be swapped for the contents of that file.',
        confirmLabel: 'Replace it',
        danger: true
      }).then(function (ok) {
        if (!ok) return;
        store.replace(data);
        toast('Brought in');
        setTimeout(function () { location.reload(); }, 600);
      });
    });
  }

  // ----------------------------------------------------------------- share ---

  function canonicalUrl() {
    return ORIGIN + '/f/' + (META.id || '');
  }

  // A share mints a fresh copy for whoever opens it, so the recipient's Delete
  // never touches the sender's. Offline, the canonical catalogue link still
  // gets them there — it just costs them a tap to make it theirs.
  function mintGift() {
    if (!env.canReachServer || !navigator.onLine) return Promise.resolve(null);
    return fetch('/api/flows/gift', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ flowId: META.id, from: env.code || null })
    }).then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { return j && j.url ? j.url : null; })
      .catch(function () { return null; });
  }

  function share() {
    var pending = toast('Making a link…', 1400);
    mintGift().then(function (url) {
      var link = url || canonicalUrl();
      var payload = {
        title: META.name,
        text: META.name + ' — ' + (META.tagline || '') + '. Tap to use it, keep it if you want it.',
        url: link
      };
      if (navigator.share) {
        navigator.share(payload).catch(function () { copyLink(link); });
      } else {
        copyLink(link);
      }
    });
    return pending;
  }

  function copyLink(link) {
    var done = function () { toast('Link copied — paste it to whoever needs it'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(link).then(done, function () { showLink(link); });
    } else {
      showLink(link);
    }
  }

  function showLink(link) {
    var input = h('input', { class: 'flow-input', value: link, readonly: true, style: { fontFamily: 'var(--mono)', fontSize: '13px' } });
    var body = h('div', {}, input);
    input.addEventListener('focus', function () { input.select(); });
    sheet({ title: 'Send this link', lede: 'Anyone who opens it gets their own copy.', body: body });
    setTimeout(function () { input.focus(); input.select(); }, 420);
  }

  // ------------------------------------------------- add to the home screen ---

  var deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
  });

  function installCoach(auto) {
    if (env.installed) return toast('It is already on your home screen');

    var body = h('div', { class: 'flow-coach' });
    if (META.mark) body.appendChild(h('span', { class: 'flow-mark-lg', html: META.mark }));
    body.appendChild(h('h2', { text: 'Keep ' + META.name }));
    body.appendChild(h('p', {
      class: 'sheet-lede',
      text: env.mode === 'file'
        ? 'This copy is already yours — it lives in your files and runs with no signal at all.'
        : 'Put it on your home screen and it opens like any other app, offline included.'
    }));

    if (env.mode === 'file') {
      body.appendChild(h('p', { class: 'flow-hint', style: { textAlign: 'center' }, text: 'Nothing else to do.' }));
    } else if (deferredPrompt) {
      // Chrome and friends: there is a real prompt, so no instructions needed.
    } else if (isIOS) {
      var steps = h('ol', { class: 'flow-steps' });
      steps.appendChild(h('li', {}, h('span', { class: 'n', text: '1' }),
        h('span', { html: 'Tap ' + ICON.ios + ' <strong>Share</strong> at the bottom of Safari' })));
      steps.appendChild(h('li', {}, h('span', { class: 'n', text: '2' }),
        h('span', { html: 'Scroll down and choose ' + ICON.plusSquare + ' <strong>Add to Home Screen</strong>' })));
      steps.appendChild(h('li', {}, h('span', { class: 'n', text: '3' }),
        h('span', { html: 'Tap <strong>Add</strong>. The icon is already made.' })));
      body.appendChild(steps);
    } else {
      body.appendChild(h('p', { class: 'flow-hint', style: { textAlign: 'center' }, text: 'Open your browser menu and choose “Install” or “Add to Home screen”.' }));
    }

    var actions = [];
    if (deferredPrompt && env.mode !== 'file') {
      actions.push({
        label: 'Add to Home Screen',
        onClick: function () {
          var p = deferredPrompt;
          deferredPrompt = null;
          p.prompt();
          p.userChoice.then(function (c) { if (c.outcome === 'accepted') toast('Added'); });
        }
      });
    }
    actions.push({
      label: 'Save the file instead',
      kind: 'quiet',
      onClick: function () { saveFileSheet(); }
    });
    actions.push({ label: auto ? 'Not now' : 'Done', kind: 'ghost' });

    sheet({ body: body, actions: actions });
    store.set('__coached', true);
  }

  var hasData = function () {
    return Object.keys(store.all()).filter(function (k) { return k.indexOf('__') !== 0; }).length > 0;
  };
  var sizeKb = function () { return Math.max(1, Math.round(PRISTINE.length / 1024)); };

  // Saving is for keeping it yourself, so your data comes along by default.
  function saveFileSheet() {
    var mine = hasData();
    sheet({
      title: 'Save ' + META.name + ' to this device',
      lede: 'One file, about ' + sizeKb() + ' KB. Open it any time, with or without a signal. Nothing about it needs texflow.work again.',
      actions: mine ? [
        { label: 'Save it with my data', onClick: function () { saveFile(true); toast('Check your downloads'); } },
        { label: 'Save an empty one', kind: 'quiet', onClick: function () { saveFile(false); toast('Check your downloads'); } },
        { label: 'Cancel', kind: 'ghost' }
      ] : [
        { label: 'Save the file', icon: 'download', onClick: function () { saveFile(false); toast('Check your downloads'); } },
        { label: 'Cancel', kind: 'ghost' }
      ]
    });
  }

  // Sending is for giving it to somebody else, so your data stays behind unless
  // you say otherwise. A packing list shared by accident is a small betrayal.
  function sendFileSheet() {
    var mine = hasData();
    var actions = [{
      label: airdroppy ? 'AirDrop or share it' : 'Share the file',
      onClick: function () { sendFile(false); }
    }];
    if (mine) {
      actions.push({
        label: 'Send it with my data in it',
        kind: 'quiet',
        onClick: function () {
          confirm({
            title: 'Send your data too?',
            lede: 'Everything you have put into ' + META.name + ' travels inside the file. Only do this if the person on the other end is meant to see it.',
            confirmLabel: 'Yes, include it'
          }).then(function (ok) { if (ok) sendFile(true); });
        }
      });
    }
    actions.push({ label: 'Cancel', kind: 'ghost' });

    sheet({
      title: 'Send ' + META.name + ' as a file',
      lede: airdroppy
        ? 'About ' + sizeKb() + ' KB, and it is the whole app — AirDrop it across the table with no signal at either end. Whoever gets it opens it in a browser and it works.'
        : 'About ' + sizeKb() + ' KB, and it is the whole app. No link, no server, no network needed at either end.',
      body: mine ? null : undefined,
      actions: actions
    });
  }

  // ---------------------------------------------------------------- delete ---

  // Delete means gone: the copy stops being served, the offline cache is
  // dropped, the service worker unregisters itself and the data is wiped. What
  // it cannot touch is the icon already on a home screen or a file already
  // downloaded, so the wording says so rather than pretending otherwise.
  function purgeLocal() {
    store.clear();
    var jobs = [];
    if (window.caches && caches.keys) {
      jobs.push(caches.keys().then(function (keys) {
        return Promise.all(keys.map(function (k) { return caches.delete(k); }));
      }).catch(function () {}));
    }
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
        return Promise.all(regs.map(function (r) {
          return r.scope.indexOf(location.origin + basePath()) === 0 ? r.unregister() : null;
        }));
      }).catch(function () {}));
    }
    return Promise.all(jobs);
  }

  function basePath() {
    var m = location.pathname.match(/^(\/[sf]\/[A-Za-z0-9_-]+\/)/);
    return m ? m[1] : '/';
  }

  function remove() {
    var isCloudCopy = env.mode === 'instance';
    confirm({
      title: 'Delete ' + META.name + '?',
      lede: isCloudCopy
        ? 'This copy stops working straight away — the link goes dead, the offline cache is dropped and everything you put in it is erased. It cannot be undone.'
        : 'Everything you have put into this copy is erased and the offline cache is dropped. The file itself stays in your downloads until you delete it there.',
      confirmLabel: 'Delete it',
      danger: true
    }).then(function (ok) {
      if (!ok) return;
      var server = isCloudCopy && navigator.onLine
        ? fetch('/api/flows/instance/' + env.code, { method: 'DELETE' }).catch(function () {})
        : Promise.resolve();
      Promise.all([server, purgeLocal()]).then(function () { goneScreen(isCloudCopy); });
    });
  }

  // No browser lets a page remove its own home-screen icon — there is no API
  // for it on iOS or Android, by design. The next best thing is to be certain
  // the icon is now harmless (it opens this) and to say, in the right words for
  // the right phone, how to get rid of it.
  function homeScreenSteps() {
    var wrap = h('div', { class: 'flow-remove' });
    wrap.appendChild(h('h2', { text: 'Taking the icon off' }));
    var steps = h('ol', { class: 'flow-steps' });
    var add = function (n, html) {
      steps.appendChild(h('li', {}, h('span', { class: 'n', text: String(n) }), h('span', { html: html })));
    };
    if (isIOS) {
      add(1, 'Touch and hold the <strong>' + esc(META.name) + '</strong> icon on your Home Screen');
      add(2, 'Choose <strong>Remove Bookmark</strong>, or <strong>Delete Bookmark</strong>');
      add(3, 'Confirm. It is gone from the phone as well as from here.');
    } else if (isAndroid) {
      add(1, 'Touch and hold the <strong>' + esc(META.name) + '</strong> icon');
      add(2, 'Drag it to <strong>Uninstall</strong>, or choose <strong>Remove</strong>');
    } else {
      add(1, 'Open the app, then its menu');
      add(2, 'Choose <strong>Uninstall</strong> — in Chrome it is under the three dots in the app window');
    }
    wrap.appendChild(steps);
    return wrap;
  }

  function goneScreen(wasCloud) {
    document.body.innerHTML = '';
    var wrap = h('div', { class: 'flow-gone' });
    if (META.mark) wrap.appendChild(h('span', { class: 'flow-mark-lg', html: META.mark }));
    wrap.appendChild(h('h1', { text: META.name + ' is gone' }));
    wrap.appendChild(h('p', {
      text: wasCloud
        ? 'The link no longer works and nothing of yours is left on it.'
        : 'Everything stored in this copy has been erased.'
    }));

    // Only worth saying if there is an icon to remove.
    if (env.installed || wasCloud) {
      wrap.appendChild(h('button', {
        class: 'flow-btn is-quiet', type: 'button', style: { width: 'auto', marginTop: '6px' },
        onclick: function () { sheet({ body: homeScreenSteps(), actions: [{ label: 'Done', kind: 'ghost' }] }); }
      }, 'How do I remove the icon?'));
    }
    if (env.canReachServer) {
      wrap.appendChild(h('a', { class: 'flow-btn is-ghost', href: ORIGIN + '/flows', style: { width: 'auto', textDecoration: 'none' } }, 'Find another Flow'));
    }
    document.body.appendChild(wrap);
  }

  // ------------------------------------------------------------------ menu ---

  function menuItem(icon, title, sub, onClick, cls) {
    return h('button', { type: 'button', class: cls || '', onclick: onClick },
      h('span', { class: 'mi', html: ICON[icon] || '' }),
      h('span', { class: 'mt' }, h('span', { text: title }), sub ? h('span', { class: 'ms', text: sub }) : null)
    );
  }

  function openMenu() {
    var list = h('div', { class: 'flow-menu' });
    var handle;

    if (env.canReachServer) {
      list.appendChild(menuItem('share', 'Send a link',
        'They get their own copy, not yours',
        function () { handle.close(); share(); }, 'is-accent'));
    }

    if (canSendFile()) {
      list.appendChild(menuItem('airdrop', airdroppy ? 'AirDrop the file' : 'Send the file',
        'Hands over the whole app — no signal needed',
        function () { handle.close(); sendFileSheet(); }, env.canReachServer ? '' : 'is-accent'));
    }

    if (!env.installed && env.mode !== 'file') {
      list.appendChild(menuItem('home', 'Add to Home Screen',
        'Opens like an app, works offline',
        function () { handle.close(); installCoach(false); }));
    }

    list.appendChild(menuItem('download', 'Save the file',
      'Keep it on this device forever',
      function () { handle.close(); saveFileSheet(); }));

    list.appendChild(h('hr'));

    list.appendChild(menuItem('upload', 'Back up my data', 'One small JSON file',
      function () { handle.close(); exportData(); }));
    list.appendChild(menuItem('download', 'Bring data in', 'From a backup file',
      function () { handle.close(); importData(); }));

    list.appendChild(h('hr'));

    list.appendChild(menuItem('info', 'About this Flow', null, function () { handle.close(); about(); }));
    list.appendChild(menuItem('trash', 'Delete', env.mode === 'instance' ? 'Stops working, everywhere' : 'Erase what is stored here',
      function () { handle.close(); remove(); }, 'is-danger'));

    handle = sheet({ title: META.name, lede: META.tagline, body: list });
    return handle;
  }

  function about() {
    var where = env.mode === 'file' ? 'a file on this device'
      : env.mode === 'instance' ? 'your own copy at ' + location.origin + basePath()
      : 'the catalogue copy — send it to yourself to get one of your own';
    var body = h('div');
    var rows = [
      ['Running from', where],
      ['Storage', store.persistent ? 'Saved on ' + store.where : 'Memory only — back up before you close it'],
      ['Offline', env.mode === 'file' ? 'Always' : (navigator.serviceWorker ? 'Yes, once it has loaded once' : 'Not on this browser')],
      ['Sends data anywhere', 'No. Everything stays on this device.']
    ];
    var ul = h('ul', { class: 'flow-list' });
    rows.forEach(function (r) {
      ul.appendChild(h('li', {}, h('span', { class: 'grow' },
        h('span', { class: 'sub', text: r[0] }), h('div', { class: 'name', style: { whiteSpace: 'normal' }, text: r[1] }))));
    });
    body.appendChild(ul);
    body.appendChild(h('p', { class: 'flow-hint', text: 'A TexFlow Flow. One file, one job.' }));
    sheet({ title: META.name, lede: META.blurb || META.tagline, body: body, actions: [{ label: 'Close', kind: 'ghost' }] });
  }

  // ----------------------------------------------------------------- chrome ---

  function wireChrome() {
    var bar = $('.flow-bar');
    var menu = $('#flow-menu');
    if (menu) menu.addEventListener('click', openMenu);

    // The manifest only means anything when there is a directory to resolve it
    // against. A downloaded copy has none, so linking it there would buy a 404
    // on every open and nothing else.
    if (env.canReachServer && basePath() !== '/') {
      document.head.appendChild(h('link', { rel: 'manifest', href: 'manifest.webmanifest' }));
    }

    if (!bar) return;
    var sentinel = h('div', { style: { position: 'absolute', top: '0', height: '1px', width: '1px' } });
    document.body.appendChild(sentinel);
    if (window.IntersectionObserver) {
      new IntersectionObserver(function (entries) {
        bar.classList.toggle('is-stuck', !entries[0].isIntersecting);
      }).observe(sentinel);
    }
  }

  function registerWorker() {
    if (!('serviceWorker' in navigator)) return;
    if (location.protocol !== 'https:' && location.hostname !== 'localhost') return;
    var base = basePath();
    if (base === '/') return;
    navigator.serviceWorker.register(base + 'sw.js', { scope: base }).catch(function () {});
  }

  // The nudge the whole share flow rests on: someone tapped a link in a
  // message, the Flow is already open and working, and *then* it offers to
  // stay. Once, never again on this device, and never over the top of a first
  // interaction — the Flow has to prove itself first.
  function maybeCoach() {
    if (env.installed || env.mode === 'file') return;
    if (store.get('__coached', false)) return;
    if (env.mode !== 'instance' && !new URLSearchParams(location.search).has('keep')) return;
    setTimeout(function () {
      if (openSheets) return;
      installCoach(true);
    }, 2600);
  }

  // ------------------------------------------------------------------- boot ---

  var readyFns = [];
  var booted = false;

  function boot() {
    if (booted) return;
    booted = true;

    // Order matters. The seed comes out of the document, then the document is
    // captured verbatim — otherwise re-saving the file would bake a second,
    // staler seed in beside the first.
    var seed = takeSeed();
    PRISTINE = '<!doctype html>\n' + document.documentElement.outerHTML;

    // Storage may have to open a database, so the Flow's own code does not run
    // until it is known what it is reading from. Nothing is drawn twice and
    // nothing starts from defaults it is about to throw away.
    initStore().then(function () {
      applySeed(seed);
      wireChrome();
      readyFns.forEach(function (fn) { try { fn(); } catch (e) { console.error(e); } });
      registerWorker();
      maybeCoach();
      if (!store.persistent) warnAboutStorage();
    });

    // Any first tap is a user gesture; use it to unlock audio for the timers.
    document.addEventListener('pointerdown', function once() {
      document.removeEventListener('pointerdown', once);
      try { audio(); } catch (e) {}
    }, { once: true });
  }

  // A Flow that cannot remember anything has to say so once, plainly, and offer
  // the way out — rather than quietly losing an afternoon's list.
  function warnAboutStorage() {
    setTimeout(function () {
      sheet({
        title: 'This copy cannot save',
        lede: 'The browser will not let a file opened from disk store anything, so what you do here lasts until you close the tab. Everything still works — it just will not be here tomorrow.',
        actions: [
          { label: 'Back up my data when I am done', kind: 'quiet', onClick: exportData },
          { label: 'Understood', kind: 'ghost' }
        ]
      });
    }, 900);
  }

  window.Flow = {
    meta: META,
    env: env,
    icons: ICON,
    ready: function (fn) { if (booted) fn(); else readyFns.push(fn); },
    $: $, $$: $$, h: h, esc: esc,
    store: store, state: state,
    toast: toast, haptic: haptic, sheet: sheet, confirm: confirm,
    num: num, money: money, dur: dur, today: today, slug: slug,
    beep: beep, audio: audio,
    keepAwake: function (on) { wakeLockWanted = !!on; keepAwake(!!on); },
    saveBlob: saveBlob, pickFile: pickFile,
    share: share, copyLink: copyLink,
    saveFile: saveFileSheet, sendFile: sendFileSheet, canSendFile: canSendFile,
    exportData: exportData, importData: importData,
    install: function () { installCoach(false); },
    remove: remove, openMenu: openMenu
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
<script>/* Pace.
 *
 * Three quantities, one equation: distance = time / pace. You say which one
 * you are missing and fill the other two. The splits underneath are the part
 * people actually use on the start line — what the watch should read at each
 * marker if the pace holds. */

Flow.ready(function () {
  var PRESETS = {
    km: [['5K', 5], ['10K', 10], ['Half', 21.0975], ['Marathon', 42.195]],
    mi: [['1 mi', 1], ['5K', 3.10686], ['10 mi', 10], ['Marathon', 26.2188]]
  };

  var s = Flow.state('run', {
    solveFor: 'pace', unit: 'km', dist: '5',
    time: { h: 0, m: 25, s: 0 },
    pace: { m: 5, s: 0 }
  });

  var el = {};
  ['solve', 'answer', 'dist', 'unit', 'presets', 'th', 'tm', 'ts', 'pm', 'ps',
    'distBlock', 'timeBlock', 'paceBlock', 'splitsBlock', 'splits', 'paceUnit'].forEach(function (k) {
    el[k] = Flow.$('#' + k.replace(/[A-Z]/g, function (c) { return '-' + c.toLowerCase(); }));
  });

  var int = function (v) { var n = parseInt(v, 10); return isFinite(n) && n > 0 ? n : 0; };
  var unitName = function () { return s.unit === 'km' ? 'kilometre' : 'mile'; };

  var totalSeconds = function () { return s.time.h * 3600 + s.time.m * 60 + s.time.s; };
  var paceSeconds = function () { return s.pace.m * 60 + s.pace.s; };
  var distance = function () { var n = parseFloat(s.dist); return isFinite(n) && n > 0 ? n : 0; };

  function setSeconds(target, secs) {
    secs = Math.max(0, Math.round(secs));
    if (target === 'time') {
      s.time = { h: Math.floor(secs / 3600), m: Math.floor(secs / 60) % 60, s: secs % 60 };
    } else {
      s.pace = { m: Math.floor(secs / 60), s: secs % 60 };
    }
  }

  // Solving happens on every keystroke, so the answer is never a button press
  // away — but only the field you are *not* editing ever changes under you.
  function solve() {
    if (s.solveFor === 'pace') {
      var d = distance();
      setSeconds('pace', d > 0 ? totalSeconds() / d : 0);
    } else if (s.solveFor === 'time') {
      setSeconds('time', paceSeconds() * distance());
    } else {
      var p = paceSeconds();
      s.dist = p > 0 ? String(Math.round((totalSeconds() / p) * 100) / 100) : '0';
    }
  }

  function clock(secs) {
    secs = Math.max(0, Math.round(secs));
    var h = Math.floor(secs / 3600);
    var m = Math.floor(secs / 60) % 60;
    var sec = secs % 60;
    var pad = function (v) { return v < 10 ? '0' + v : String(v); };
    return h ? h + ':' + pad(m) + ':' + pad(sec) : m + ':' + pad(sec);
  }

  function render() {
    Flow.$$('#solve button').forEach(function (b) {
      b.setAttribute('aria-pressed', b.dataset.for === s.solveFor ? 'true' : 'false');
    });
    el.distBlock.classList.toggle('flow-hidden', s.solveFor === 'dist');
    el.timeBlock.classList.toggle('flow-hidden', s.solveFor === 'time');
    el.paceBlock.classList.toggle('flow-hidden', s.solveFor === 'pace');

    el.dist.value = s.dist;
    el.unit.value = s.unit;
    el.th.value = s.time.h || '';
    el.tm.value = s.time.m || '';
    el.ts.value = s.time.s || '';
    el.pm.value = s.pace.m || '';
    el.ps.value = s.pace.s || '';
    el.paceUnit.textContent = 'per ' + unitName();

    renderPresets();
    renderAnswer();
    renderSplits();
  }

  function renderPresets() {
    el.presets.innerHTML = '';
    PRESETS[s.unit].forEach(function (p) {
      el.presets.appendChild(Flow.h('button', {
        class: 'flow-chip', type: 'button', text: p[0],
        'aria-pressed': Math.abs(distance() - p[1]) < 0.01 ? 'true' : 'false',
        onclick: function () { s.dist = String(p[1]); solve(); s.save(); render(); Flow.haptic(); }
      }));
    });
  }

  function renderAnswer() {
    el.answer.innerHTML = '';
    var tile = Flow.h('div', { class: 'flow-tile', style: { marginBottom: '4px' } });
    var label, value, note;

    if (s.solveFor === 'pace') {
      label = 'Pace';
      value = distance() > 0 && totalSeconds() > 0 ? clock(paceSeconds()) : '—';
      note = distance() > 0 && totalSeconds() > 0
        ? 'per ' + unitName() + ' · ' + otherUnitPace() + ' · ' + speed()
        : 'Fill in a distance and a time.';
    } else if (s.solveFor === 'time') {
      label = 'Finish time';
      value = distance() > 0 && paceSeconds() > 0 ? clock(totalSeconds()) : '—';
      note = distance() > 0 && paceSeconds() > 0
        ? Flow.num(distance(), 2).replace(/\.00$/, '') + ' ' + s.unit + ' at ' + clock(paceSeconds()) + ' per ' + unitName()
        : 'Fill in a distance and a pace.';
    } else {
      label = 'Distance';
      value = paceSeconds() > 0 && totalSeconds() > 0 ? Flow.num(distance(), 2) + ' ' + s.unit : '—';
      note = paceSeconds() > 0 && totalSeconds() > 0
        ? clock(totalSeconds()) + ' at ' + clock(paceSeconds()) + ' per ' + unitName()
        : 'Fill in a time and a pace.';
    }

    tile.appendChild(Flow.h('div', { class: 'flow-tile-label', text: label }));
    tile.appendChild(Flow.h('div', { class: 'flow-tile-value', text: value }));
    tile.appendChild(Flow.h('div', { class: 'flow-tile-note', text: note }));
    el.answer.appendChild(tile);
  }

  function otherUnitPace() {
    var factor = s.unit === 'km' ? 1.609344 : 1 / 1.609344;
    var other = s.unit === 'km' ? 'mile' : 'kilometre';
    return clock(paceSeconds() * factor) + ' per ' + other;
  }

  function speed() {
    var p = paceSeconds();
    if (!p) return '';
    return Flow.num(3600 / p, 1) + ' ' + (s.unit === 'km' ? 'km/h' : 'mph');
  }

  function renderSplits() {
    var d = distance();
    var p = paceSeconds();
    var show = d > 0 && p > 0 && d <= 100;
    el.splitsBlock.classList.toggle('flow-hidden', !show);
    if (!show) return;

    el.splits.innerHTML = '';
    var marks = [];
    for (var k = 1; k <= Math.floor(d); k++) marks.push(k);
    if (d - Math.floor(d) > 0.02) marks.push(d);
    // Beyond a dozen markers the list stops being something you glance at, so
    // it thins out to every fifth one and always keeps the finish.
    var step = marks.length > 14 ? Math.ceil(marks.length / 12) : 1;

    marks.forEach(function (mark, i) {
      if (step > 1 && i % step !== 0 && i !== marks.length - 1) return;
      var last = i === marks.length - 1;
      el.splits.appendChild(Flow.h('li', {},
        Flow.h('span', { class: 'k', text: (mark === Math.round(mark) ? mark : Flow.num(mark, 2)) + ' ' + s.unit }),
        Flow.h('span', { class: 'grow sub', text: last ? 'finish' : '' }),
        Flow.h('span', { class: 'val' + (last ? ' fast' : ''), text: clock(p * mark) })
      ));
    });
  }

  var timer;
  function changed() {
    solve();
    clearTimeout(timer);
    timer = setTimeout(function () { s.save(); }, 300);
    // Re-render everything except the field being typed into, which solve()
    // never touches because it only writes the quantity being solved for.
    renderAnswer();
    renderSplits();
    if (s.solveFor === 'pace') { el.pm.value = s.pace.m || ''; el.ps.value = s.pace.s || ''; }
    if (s.solveFor === 'time') { el.th.value = s.time.h || ''; el.tm.value = s.time.m || ''; el.ts.value = s.time.s || ''; }
    if (s.solveFor === 'dist') { el.dist.value = s.dist; renderPresets(); }
  }

  Flow.$$('#solve button').forEach(function (b) {
    b.addEventListener('click', function () {
      s.solveFor = b.dataset.for; solve(); s.save(); render(); Flow.haptic();
    });
  });

  el.dist.addEventListener('input', function (e) { s.dist = e.target.value; changed(); renderPresets(); });
  el.unit.addEventListener('change', function (e) {
    // Changing units keeps the run you described, not the numbers you typed:
    // 5 km stays 5 km, and the pace per mile is recomputed from it.
    var d = distance();
    var factor = e.target.value === 'mi' ? 1 / 1.609344 : 1.609344;
    s.unit = e.target.value;
    if (d > 0 && s.solveFor !== 'dist') s.dist = String(Math.round(d * factor * 1000) / 1000);
    solve(); s.save(); render();
  });

  [['th', 'time', 'h'], ['tm', 'time', 'm'], ['ts', 'time', 's'], ['pm', 'pace', 'm'], ['ps', 'pace', 's']]
    .forEach(function (row) {
      el[row[0]].addEventListener('input', function (e) {
        s[row[1]][row[2]] = int(e.target.value);
        changed();
      });
    });

  render();
});</script>
</body>
</html>
