<style>/* The look every Flow inherits.
 *
 * One rule governs everything here: a Flow has to feel the same opened from a
 * home-screen icon, from a link in a message, and from a file sitting in
 * Downloads with no network at all. So there are no web fonts, no external
 * stylesheets and no images — the accent is the two colours from the Flow's
 * own icon, injected as --a1/--a2, and everything else is drawn with CSS.
 */

:root {
  --a1: #0369a1;
  --a2: #38bdf8;

  --bg: #f6f6f7;
  --bg-deep: #eeeef1;
  --surface: #ffffff;
  --surface-2: #fafafb;
  --line: rgba(9, 9, 11, 0.09);
  --line-strong: rgba(9, 9, 11, 0.16);
  --ink: #18181b;
  --ink-2: #52525b;
  --ink-3: #8b8b95;
  --danger: #dc2626;
  --good: #15803d;

  --shadow-1: 0 1px 2px rgba(9, 9, 11, 0.04), 0 1px 3px rgba(9, 9, 11, 0.05);
  --shadow-2: 0 2px 6px rgba(9, 9, 11, 0.05), 0 12px 28px rgba(9, 9, 11, 0.09);
  --shadow-3: 0 10px 40px rgba(9, 9, 11, 0.18);

  --r-sm: 10px;
  --r: 14px;
  --r-lg: 20px;
  --r-xl: 26px;

  --pad: 18px;
  --tap: 48px;
  --header: 56px;

  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  --ease: cubic-bezier(0.32, 0.72, 0, 1);
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0c0c0e;
    --bg-deep: #08080a;
    --surface: #17171a;
    --surface-2: #1e1e22;
    --line: rgba(255, 255, 255, 0.09);
    --line-strong: rgba(255, 255, 255, 0.18);
    --ink: #f4f4f5;
    --ink-2: #a1a1aa;
    --ink-3: #71717a;
    --danger: #f87171;
    --good: #4ade80;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow-2: 0 2px 6px rgba(0, 0, 0, 0.4), 0 12px 28px rgba(0, 0, 0, 0.5);
    --shadow-3: 0 10px 40px rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overscroll-behavior-y: none;
}

body {
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.45;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  text-size-adjust: 100%;
  -webkit-text-size-adjust: 100%;
}

button, input, select, textarea { font: inherit; color: inherit; }
input, textarea, select { -webkit-appearance: none; appearance: none; }
h1, h2, h3, h4, p, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }
a { color: var(--a1); }
@media (prefers-color-scheme: dark) { a { color: var(--a2); } }

/* ------------------------------------------------------------------ layout */

.flow-app {
  display: flex;
  flex-direction: column;
  min-height: 100%;
  min-height: 100dvh;
}

.flow-bar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 10px;
  height: calc(var(--header) + env(safe-area-inset-top));
  padding: env(safe-area-inset-top) max(var(--pad), env(safe-area-inset-left)) 0 max(var(--pad), env(safe-area-inset-right));
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: saturate(1.6) blur(16px);
  -webkit-backdrop-filter: saturate(1.6) blur(16px);
  border-bottom: 1px solid transparent;
  transition: border-color 0.2s;
}
.flow-bar.is-stuck { border-bottom-color: var(--line); }

/* One inline SVG, sized by whoever is showing it. */
.flow-mark { display: block; width: 100%; height: 100%; }
.flow-mark-sm { flex: none; display: block; width: 28px; height: 28px; }
.flow-mark-lg { display: block; width: 78px; height: 78px; margin: 6px auto 15px; filter: drop-shadow(0 8px 22px rgba(9, 9, 11, 0.2)); }

.flow-bar-title {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.flow-bar-spacer { flex: 1; }

.flow-icon-btn {
  flex: none;
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--ink-2);
  cursor: pointer;
  transition: background 0.15s, color 0.15s, transform 0.15s var(--ease);
}
.flow-icon-btn:hover { background: var(--line); color: var(--ink); }
.flow-icon-btn:active { transform: scale(0.9); }
.flow-icon-btn svg { width: 21px; height: 21px; }

.flow-main {
  flex: 1;
  width: 100%;
  max-width: 680px;
  margin: 0 auto;
  padding: 12px max(var(--pad), env(safe-area-inset-left)) calc(40px + env(safe-area-inset-bottom)) max(var(--pad), env(safe-area-inset-right));
  display: flex;
  flex-direction: column;
}

/* A dock that stays put at the bottom of the viewport for the one action a
 * Flow is really about — Start, Add, Settle up. */
.flow-dock {
  position: sticky;
  bottom: 0;
  z-index: 30;
  /* `auto` rather than a fixed gap: on a short page the action sits at the
     bottom of the screen where a thumb is, and on a long one it rides the
     scroll instead of running away up the page. */
  margin: 16px calc(var(--pad) * -1) 0;
  margin-top: auto;
  padding: 12px var(--pad) calc(12px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--bg) 62%, transparent);
}

/* ------------------------------------------------------------- typography */

.flow-lede {
  color: var(--ink-2);
  font-size: 15px;
  margin-bottom: 18px;
}

.flow-label {
  display: block;
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin: 0 0 8px 2px;
}

.flow-section { margin-top: 26px; }
.flow-section:first-child { margin-top: 6px; }

.flow-hint { font-size: 13px; color: var(--ink-3); margin-top: 8px; }

.flow-empty {
  text-align: center;
  padding: 44px 20px;
  color: var(--ink-3);
  font-size: 15px;
}
.flow-empty strong { display: block; color: var(--ink-2); font-weight: 600; margin-bottom: 4px; }

.num { font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------- surfaces */

.flow-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-1);
  padding: 16px;
}
.flow-card + .flow-card { margin-top: 12px; }

.flow-tile {
  border-radius: var(--r-xl);
  padding: 22px 20px;
  color: #fff;
  background: linear-gradient(135deg, var(--a1), var(--a2));
  box-shadow: var(--shadow-2);
}
.flow-tile .flow-tile-value {
  font-size: clamp(38px, 13vw, 56px);
  font-weight: 680;
  letter-spacing: -0.035em;
  line-height: 1;
  font-variant-numeric: tabular-nums;

/* --------------------------------------------------------------- controls */

.flow-field { margin-bottom: 14px; }

.flow-input, .flow-select, .flow-textarea {

.flow-row { display: flex; gap: 10px; }

.flow-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  min-height: 52px;
  padding: 0 20px;
  border: 0;
  border-radius: var(--r);
  background: linear-gradient(135deg, var(--a1), var(--a2));

.flow-btn.is-quiet {

}

.flow-check {

        { label: 'Save it with my data', onClick: function () { saveFile(true); toast('Check your downloads'); } },
        { label: 'Save an empty one', kind: 'quiet', onClick: function () { saveFile(false); toast('Check your downloads'); } },
        { label: 'Cancel', kind: 'ghost' }
      ] : [
        { label: 'Save the file', icon: 'download', onClick: function () { saveFile(false); toast('Check your downloads'); } },
        { label: 'Cancel', kind: 'ghost' }
      ]
    });
  }

  // ---------------------------------------------------------------- delete ---

  // Delete means gone: the copy stops being served, the offline cache is
  // dropped, the service worker unregisters itself and the data is wiped. What
  // it cannot touch is the icon already on a home screen or a file already
  // downloaded, so the wording says so rather than pretending otherwise.
  function purgeLocal() {
    store.clear();
    var jobs = [];
    if (window.caches && caches.keys) {
      jobs.push(caches.keys().then(function (keys) {
        return Promise.all(keys.map(function (k) { return caches.delete(k); }));
      }).catch(function () {}));
    }
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
        return Promise.all(regs.map(function (r) {
          return r.scope.indexOf(location.origin + basePath()) === 0 ? r.unregister() : null;
        }));
      }).catch(function () {}));
    }
    return Promise.all(jobs);
  }

  function basePath() {
    var m = location.pathname.match(/^(\/[sf]\/[A-Za-z0-9_-]+\/)/);
    return m ? m[1] : '/';
  }

  function remove() {
    var isCloudCopy = env.mode === 'instance';
    confirm({
      title: 'Delete ' + META.name + '?',
      lede: isCloudCopy
        ? 'This copy stops working straight away — the link goes dead, the offline cache is dropped and everything you put in it is erased. It cannot be undone.'
        : 'Everything you have put into this copy is erased and the offline cache is dropped. The file itself stays in your downloads until you delete it there.',
      confirmLabel: 'Delete it',
      danger: true
    }).then(function (ok) {
      if (!ok) return;
      var server = isCloudCopy && navigator.onLine
        ? fetch('/api/flows/instance/' + env.code, { method: 'DELETE' }).catch(function () {})
        : Promise.resolve();
      Promise.all([server, purgeLocal()]).then(function () { goneScreen(isCloudCopy); });
    });
  }

  function goneScreen(wasCloud) {
    document.body.innerHTML = '';
    var wrap = h('div', { class: 'flow-gone' });
    if (META.mark) wrap.appendChild(h('span', { class: 'flow-mark-lg', html: META.mark }));
    wrap.appendChild(h('h1', { text: META.name + ' is gone' }));
    wrap.appendChild(h('p', {
      text: wasCloud
        ? 'The link no longer works and nothing of yours is left on it. If it is still on your home screen, hold the icon and remove it.'
        : 'Everything stored in this copy has been erased.'
    }));
    if (env.canReachServer) {
      wrap.appendChild(h('a', { class: 'flow-btn is-quiet', href: ORIGIN + '/flows', style: { width: 'auto', marginTop: '10px', textDecoration: 'none' } }, 'Find another Flow'));
    }
    document.body.appendChild(wrap);
  }

  // ------------------------------------------------------------------ menu ---

  function menuItem(icon, title, sub, onClick, cls) {
    return h('button', { type: 'button', class: cls || '', onclick: onClick },
      h('span', { class: 'mi', html: ICON[icon] || '' }),
      h('span', { class: 'mt' }, h('span', { text: title }), sub ? h('span', { class: 'ms', text: sub }) : null)
    );
  }

  function openMenu() {
    var list = h('div', { class: 'flow-menu' });
    var handle;

    list.appendChild(menuItem('share', 'Send it to someone',
      'They get their own copy, not yours',
      function () { handle.close(); share(); }, 'is-accent'));

    if (!env.installed && env.mode !== 'file') {
      list.appendChild(menuItem('home', 'Add to Home Screen',
        'Opens like an app, works offline',
        function () { handle.close(); installCoach(false); }));
    }

    list.appendChild(menuItem('download', 'Save the file',
      'Keep it on this device forever',
      function () { handle.close(); saveFileSheet(); }));

    list.appendChild(h('hr'));

    list.appendChild(menuItem('upload', 'Back up my data', 'One small JSON file',
      function () { handle.close(); exportData(); }));
    list.appendChild(menuItem('download', 'Bring data in', 'From a backup file',
      function () { handle.close(); importData(); }));

    list.appendChild(h('hr'));

    list.appendChild(menuItem('info', 'About this Flow', null, function () { handle.close(); about(); }));
    list.appendChild(menuItem('trash', 'Delete', env.mode === 'instance' ? 'Stops working, everywhere' : 'Erase what is stored here',
      function () { handle.close(); remove(); }, 'is-danger'));

    handle = sheet({ title: META.name, lede: META.tagline, body: list });
    return handle;
  }

  function about() {
    var where = env.mode === 'file' ? 'a file on this device'
      : env.mode === 'instance' ? 'your own copy at ' + location.origin + basePath()
      : 'the catalogue copy — send it to yourself to get one of your own';
    var body = h('div');
    var rows = [
      ['Running from', where],
      ['Storage', store.persistent ? 'Saved on this device' : 'Memory only — back up before you close it'],
      ['Offline', env.mode === 'file' ? 'Always' : (navigator.serviceWorker ? 'Yes, once it has loaded once' : 'Not on this browser')],
      ['Sends data anywhere', 'No. Everything stays on this device.']
    ];
    var ul = h('ul', { class: 'flow-list' });
    rows.forEach(function (r) {
      ul.appendChild(h('li', {}, h('span', { class: 'grow' },
        h('span', { class: 'sub', text: r[0] }), h('div', { class: 'name', style: { whiteSpace: 'normal' }, text: r[1] }))));
    });
    body.appendChild(ul);
    body.appendChild(h('p', { class: 'flow-hint', text: 'A TexFlow Flow. One file, one job.' }));
    sheet({ title: META.name, lede: META.blurb || META.tagline, body: body, actions: [{ label: 'Close', kind: 'ghost' }] });
  }

  // ----------------------------------------------------------------- chrome ---

  function buildChrome() {
    var bar = $('.flow-bar');
    if (!bar) return;
    bar.innerHTML = '';
    if (META.mark) bar.appendChild(h('span', { class: 'flow-mark-sm', html: META.mark }));
    bar.appendChild(h('span', { class: 'flow-bar-title', text: META.name || 'Flow' }));
    bar.appendChild(h('span', { class: 'flow-bar-spacer' }));
    bar.appendChild(h('button', {
      class: 'flow-icon-btn', type: 'button', 'aria-label': 'Menu', html: ICON.more, onclick: openMenu
    }));

    var sentinel = h('div', { style: { position: 'absolute', top: '0', height: '1px', width: '1px' } });
    document.body.appendChild(sentinel);
    if (window.IntersectionObserver) {
      new IntersectionObserver(function (entries) {
        bar.classList.toggle('is-stuck', !entries[0].isIntersecting);
      }).observe(sentinel);
    }
  }

  function registerWorker() {
    if (!('serviceWorker' in navigator)) return;
    if (location.protocol !== 'https:' && location.hostname !== 'localhost') return;
    var base = basePath();
    if (base === '/') return;
    navigator.serviceWorker.register(base + 'sw.js', { scope: base }).catch(function () {});
  }

  // The nudge the whole share flow rests on: someone tapped a link in a
  // message, the Flow is already open and working, and *then* it offers to
  // stay. Once, never again on this device, and never over the top of a first
  // interaction — the Flow has to prove itself first.
  function maybeCoach() {
    if (env.installed || env.mode === 'file') return;
    if (store.get('__coached', false)) return;
    if (env.mode !== 'instance' && !new URLSearchParams(location.search).has('keep')) return;
    setTimeout(function () {
      if (openSheets) return;
      installCoach(true);
    }, 2600);
  }

  // ------------------------------------------------------------------- boot ---

  var readyFns = [];
  var booted = false;

  function boot() {
    if (booted) return;
    booted = true;
    var seed = takeSeed();
    PRISTINE = '<!doctype html>\n' + document.documentElement.outerHTML;
    applySeed(seed);
    document.documentElement.style.setProperty('--a1', (META.colors && META.colors[0]) || '#0369a1');
    document.documentElement.style.setProperty('--a2', (META.colors && META.colors[1]) || '#38bdf8');
    buildChrome();
    readyFns.forEach(function (fn) { try { fn(); } catch (e) { console.error(e); } });
    registerWorker();
    maybeCoach();
    // Any first tap is a user gesture; use it to unlock audio for the timers.
    document.addEventListener('pointerdown', function once() {
      document.removeEventListener('pointerdown', once);
      try { audio(); } catch (e) {}
    }, { once: true });
  }

  window.Flow = {
    meta: META,
    env: env,
    icons: ICON,
    ready: function (fn) { if (booted) fn(); else readyFns.push(fn); },
    $: $, $$: $$, h: h, esc: esc,
    store: store, state: state,
    toast: toast, haptic: haptic, sheet: sheet, confirm: confirm,
    num: num, money: money, dur: dur, today: today, slug: slug,
    beep: beep, audio: audio,
    keepAwake: function (on) { wakeLockWanted = !!on; keepAwake(!!on); },
    saveBlob: saveBlob, pickFile: pickFile,
    share: share, copyLink: copyLink,
    saveFile: saveFileSheet, exportData: exportData, importData: importData,
    install: function () { installCoach(false); },
    remove: remove, openMenu: openMenu
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
<script>/* Packing.
 *
 * A packing list is only useful if it already exists when you are tired and
 * leaving in an hour, so this starts from a real list rather than an empty one.
 * The templates are opinionated on purpose — the things people forget, not the
 * things people obviously remember.
 *
 * "New trip" clears the ticks and keeps the list, because the list is the part
 * you spent effort on and the ticks are the part that is disposable. */

Flow.ready(function () {
  var TEMPLATES = {
    'Beach': {
      Clothes: ['Swimmers', 'Rash top', 'Thongs', 'Hat', 'Something warm for the evening'],
      Wash: ['Sunscreen', 'Aloe vera', 'Insect repellent', 'Toothbrush'],
      Bag: ['Beach towel', 'Sunglasses', 'Book', 'Dry bag', 'Water bottle'],
      Papers: ['Passport', 'Boarding pass', 'Travel insurance']
    },
    'Snow': {
      Clothes: ['Thermals ×2', 'Ski socks ×3', 'Waterproof jacket', 'Salopettes', 'Fleece', 'Beanie', 'Gloves'],
      Gear: ['Goggles', 'Helmet', 'Lift pass', 'Hand warmers', 'Boot bag'],
      Wash: ['Lip balm', 'High-factor sunscreen', 'Ibuprofen'],
      Papers: ['Passport', 'Insurance with winter sports cover']
    },
    'City break': {
      Clothes: ['Comfortable shoes', 'One smart outfit', 'Layers', 'Light jacket'],
      Bag: ['Day bag', 'Umbrella', 'Reusable bottle', 'Adaptor'],
      Tech: ['Phone charger', 'Power bank', 'Headphones'],
      Papers: ['Passport', 'Cards', 'Hotel address written down']
    },
    'Camping': {
      Shelter: ['Tent', 'Pegs and mallet', 'Sleeping bag', 'Mat', 'Pillow'],
      Kitchen: ['Stove and gas', 'Lighter', 'Pot and pan', 'Cutlery', 'Mug', 'Tea towel', 'Bin bags'],
      Kit: ['Head torch', 'Batteries', 'First aid kit', 'Rope', 'Power bank'],
      Clothes: ['Waterproof', 'Warm layer', 'Spare socks', 'Boots']
    },
    'Work trip': {
      Bag: ['Laptop and charger', 'Notebook', 'Business cards', 'Adaptor', 'Headphones'],
      Clothes: ['Shirts', 'One spare outfit', 'Shoe care', 'Gym kit'],
      Papers: ['ID', 'Expense card', 'Printed itinerary'],
      Wash: ['Wash bag', 'Painkillers']
    },
    'With a baby': {
      Feeding: ['Bottles', 'Formula or expressed milk', 'Bibs', 'Snacks'],
      Changing: ['Nappies ×8 a day', 'Wipes', 'Changing mat', 'Nappy bags', 'Two spare outfits'],
      Sleep: ['Travel cot', 'Sleeping bag', 'The comfort thing', 'Blackout blind'],
      Out: ['Pram or carrier', 'Rain cover', 'Sunshade', 'Calpol']
    }
  };

  var s = Flow.state('list', { trip: '', groups: {}, ticked: [] });

  var el = {
    groups: Flow.$('#groups'), templates: Flow.$('#templates'),
    emptyBlock: Flow.$('#empty-block'), arc: Flow.$('#arc')
  };
  var CIRC = 2 * Math.PI * 16;
  el.arc.style.strokeDasharray = CIRC;

  var allItems = function () {
    return Object.keys(s.groups).reduce(function (a, g) { return a.concat(s.groups[g]); }, []);
  };
  var key = function (group, item) { return group + '::' + item; };
  var isTicked = function (group, item) { return s.ticked.indexOf(key(group, item)) > -1; };

  function toggle(group, item) {
    var k = key(group, item);
    var at = s.ticked.indexOf(k);
    if (at > -1) s.ticked.splice(at, 1);
    else { s.ticked.push(k); Flow.haptic(); }
    s.save();
    paintHead();
  }

  function paintHead() {
    var total = allItems().length;
    var done = s.ticked.length;
    var pct = total ? Math.round((done / total) * 100) : 0;
    Flow.$('#pct').textContent = pct + '%';
    el.arc.style.strokeDashoffset = CIRC * (1 - (total ? done / total : 0));
    Flow.$('#trip-name').textContent = s.trip || 'Your list';
    Flow.$('#left').textContent = !total ? 'Nothing on it yet'
      : done === total ? 'All packed' : (total - done) + ' still to go';
    Flow.$('#sub').textContent = !total ? 'Start from a trip below.'
      : done === total ? 'Go. Have a good one.' : done + ' of ' + total + ' done';
  }

  function render() {
    el.emptyBlock.classList.toggle('flow-hidden', allItems().length > 0);
    el.templates.innerHTML = '';
    Object.keys(TEMPLATES).forEach(function (name) {
      el.templates.appendChild(Flow.h('button', {
        type: 'button', text: name, onclick: function () { load(name); }
      }));
    });

    el.groups.innerHTML = '';
    Object.keys(s.groups).forEach(function (group) {
      var items = s.groups[group];
      if (!items.length) return;
      var block = Flow.h('div', { class: 'pk-group' });
      var head = Flow.h('div', { class: 'pk-group-head' });
      head.appendChild(Flow.h('span', { text: group }));
      head.appendChild(Flow.h('span', {
        text: items.filter(function (i) { return isTicked(group, i); }).length + '/' + items.length
      }));
      block.appendChild(head);

      var card = Flow.h('div', { class: 'flow-card', style: { padding: '8px 12px' } });
      items.forEach(function (item) {
        var row = Flow.h('div', { class: 'pk-item' });
        var label = Flow.h('label', { class: 'flow-check' });
        var input = Flow.h('input', { type: 'checkbox', checked: isTicked(group, item) });
        input.addEventListener('change', function () { toggle(group, item); head.children[1].textContent = items.filter(function (i) { return isTicked(group, i); }).length + '/' + items.length; });
        label.appendChild(input);
        label.appendChild(Flow.h('span', { class: 'box', html: Flow.icons.check }));
        label.appendChild(Flow.h('span', { class: 'txt', text: item }));
        row.appendChild(label);
        row.appendChild(Flow.h('button', {
          class: 'flow-x', type: 'button', 'aria-label': 'Remove ' + item, html: Flow.icons.x,
          onclick: function () {
            s.groups[group] = s.groups[group].filter(function (i) { return i !== item; });
            s.ticked = s.ticked.filter(function (k) { return k !== key(group, item); });
            if (!s.groups[group].length) delete s.groups[group];
            s.save(); render();
          }
        }));
        card.appendChild(row);
      });
      block.appendChild(card);
      el.groups.appendChild(block);
    });

    paintHead();
  }

  function load(name) {
    var apply = function () {
      var tpl = TEMPLATES[name];
      Object.keys(tpl).forEach(function (group) {
        s.groups[group] = (s.groups[group] || []).slice();
        tpl[group].forEach(function (item) {
          if (s.groups[group].indexOf(item) === -1) s.groups[group].push(item);
        });
      });
      s.trip = s.trip || name;
      s.save(); render(); Flow.haptic(30);
    };
    if (!allItems().length) return apply();
    Flow.confirm({
      title: 'Add the ' + name + ' list?',
      lede: 'It gets merged into what you already have — nothing you added is lost.',
      confirmLabel: 'Add it'
    }).then(function (ok) { if (ok) apply(); });
  }

  function addSheet() {
    var body = Flow.h('div');
    var item = Flow.h('input', { class: 'flow-input', placeholder: 'What are you taking', 'aria-label': 'Item' });
    var groups = Object.keys(s.groups);
    var chosen = groups[0] || 'Bag';

    body.appendChild(item);
    body.appendChild(Flow.h('span', { class: 'flow-label', text: 'Into', style: { marginTop: '14px' } }));
    var chips = Flow.h('div', { class: 'flow-chips' });
    function paintChips() {
      chips.innerHTML = '';
      groups.concat(groups.indexOf('Other') > -1 ? [] : ['Other']).forEach(function (g) {
        chips.appendChild(Flow.h('button', {
          class: 'flow-chip', type: 'button', text: g, 'aria-pressed': chosen === g ? 'true' : 'false',
          onclick: function () { chosen = g; paintChips(); }
        }));
      });
    }
    paintChips();
    body.appendChild(chips);

    Flow.sheet({
      title: 'Add something',
      body: body,
      actions: [
        { label: 'Add it', onClick: function () {
          var text = item.value.trim().slice(0, 60);
          if (!text) return;
          s.groups[chosen] = s.groups[chosen] || [];
          if (s.groups[chosen].indexOf(text) === -1) s.groups[chosen].push(text);
          s.save(); render(); Flow.haptic();
        } },
        { label: 'Cancel', kind: 'ghost' }
      ]
    });
    setTimeout(function () { item.focus(); }, 420);
  }

  Flow.$('#add').addEventListener('click', addSheet);
  Flow.$('#reset').addEventListener('click', function () {
    if (!allItems().length) return Flow.toast('There is nothing to reset');
    Flow.sheet({
      title: 'Starting a new trip?',
      lede: 'The list you have built is worth keeping. Clearing the ticks gets you a fresh run through it.',
      actions: [
        { label: 'Untick everything', onClick: function () {
          s.ticked = []; s.save(); render(); Flow.toast('Ready for the next one');
        } },
        { label: 'Start from nothing', kind: 'quiet', onClick: function () {
          Flow.confirm({
            title: 'Throw the list away?', lede: 'Every item and every tick goes.',
            confirmLabel: 'Throw it away', danger: true
          }).then(function (ok) {
            if (!ok) return;
            s.groups = {}; s.ticked = []; s.trip = ''; s.save(); render();
          });
        } },
        { label: 'Cancel', kind: 'ghost' }
      ]
    });
  });

  render();
});</script>
</body>
