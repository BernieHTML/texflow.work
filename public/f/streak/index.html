<style>/* The look every Flow inherits.
 *
 * One rule governs everything here: a Flow has to feel the same opened from a
 * home-screen icon, from a link in a message, and from a file sitting in
 * Downloads with no network at all. So there are no web fonts, no external
 * stylesheets and no images — the accent is the two colours from the Flow's
 * own icon, injected as --a1/--a2, and everything else is drawn with CSS.
 */

:root {
  --a1: #0369a1;
  --a2: #38bdf8;

  --bg: #f6f6f7;
  --bg-deep: #eeeef1;
  --surface: #ffffff;
  --surface-2: #fafafb;
  --line: rgba(9, 9, 11, 0.09);
  --line-strong: rgba(9, 9, 11, 0.16);
  --ink: #18181b;
  --ink-2: #52525b;
  --ink-3: #8b8b95;
  --danger: #dc2626;
  --good: #15803d;

  --shadow-1: 0 1px 2px rgba(9, 9, 11, 0.04), 0 1px 3px rgba(9, 9, 11, 0.05);
  --shadow-2: 0 2px 6px rgba(9, 9, 11, 0.05), 0 12px 28px rgba(9, 9, 11, 0.09);
  --shadow-3: 0 10px 40px rgba(9, 9, 11, 0.18);

  --r-sm: 10px;
  --r: 14px;
  --r-lg: 20px;
  --r-xl: 26px;

  --pad: 18px;
  --tap: 48px;
  --header: 56px;

  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  --ease: cubic-bezier(0.32, 0.72, 0, 1);
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0c0c0e;
    --bg-deep: #08080a;
    --surface: #17171a;
    --surface-2: #1e1e22;
    --line: rgba(255, 255, 255, 0.09);
    --line-strong: rgba(255, 255, 255, 0.18);
    --ink: #f4f4f5;
    --ink-2: #a1a1aa;
    --ink-3: #71717a;
    --danger: #f87171;
    --good: #4ade80;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow-2: 0 2px 6px rgba(0, 0, 0, 0.4), 0 12px 28px rgba(0, 0, 0, 0.5);
    --shadow-3: 0 10px 40px rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overscroll-behavior-y: none;
}

body {
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.45;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  text-size-adjust: 100%;
  -webkit-text-size-adjust: 100%;
}

button, input, select, textarea { font: inherit; color: inherit; }
input, textarea, select { -webkit-appearance: none; appearance: none; }
h1, h2, h3, h4, p, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }
a { color: var(--a1); }
@media (prefers-color-scheme: dark) { a { color: var(--a2); } }

/* ------------------------------------------------------------------ layout */

.flow-app {
  display: flex;
  flex-direction: column;
  min-height: 100%;
  min-height: 100dvh;
}

.flow-bar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 10px;
  height: calc(var(--header) + env(safe-area-inset-top));
  padding: env(safe-area-inset-top) max(var(--pad), env(safe-area-inset-left)) 0 max(var(--pad), env(safe-area-inset-right));
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: saturate(1.6) blur(16px);
  -webkit-backdrop-filter: saturate(1.6) blur(16px);
  border-bottom: 1px solid transparent;
  transition: border-color 0.2s;
}
.flow-bar.is-stuck { border-bottom-color: var(--line); }

/* One inline SVG, sized by whoever is showing it. */
.flow-mark { display: block; width: 100%; height: 100%; }
.flow-mark-sm { flex: none; display: block; width: 28px; height: 28px; }
.flow-mark-lg { display: block; width: 78px; height: 78px; margin: 6px auto 15px; filter: drop-shadow(0 8px 22px rgba(9, 9, 11, 0.2)); }

.flow-bar-title {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.flow-bar-spacer { flex: 1; }

.flow-icon-btn {
  flex: none;
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--ink-2);
  cursor: pointer;
  transition: background 0.15s, color 0.15s, transform 0.15s var(--ease);
}
.flow-icon-btn:hover { background: var(--line); color: var(--ink); }
.flow-icon-btn:active { transform: scale(0.9); }
.flow-icon-btn svg { width: 21px; height: 21px; }

.flow-main {
  flex: 1;
  width: 100%;
  max-width: 680px;
  margin: 0 auto;
  padding: 12px max(var(--pad), env(safe-area-inset-left)) calc(40px + env(safe-area-inset-bottom)) max(var(--pad), env(safe-area-inset-right));
  display: flex;
  flex-direction: column;
}

/* A dock that stays put at the bottom of the viewport for the one action a
 * Flow is really about — Start, Add, Settle up. */
.flow-dock {
  position: sticky;
  bottom: 0;
  z-index: 30;
  /* `auto` rather than a fixed gap: on a short page the action sits at the
     bottom of the screen where a thumb is, and on a long one it rides the
     scroll instead of running away up the page. */
  margin: 16px calc(var(--pad) * -1) 0;
  margin-top: auto;
  padding: 12px var(--pad) calc(12px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--bg) 62%, transparent);
}

/* ------------------------------------------------------------- typography */

.flow-lede {
  color: var(--ink-2);
  font-size: 15px;
  margin-bottom: 18px;
}

.flow-label {
  display: block;
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin: 0 0 8px 2px;
}

.flow-section { margin-top: 26px; }
.flow-section:first-child { margin-top: 6px; }

.flow-hint { font-size: 13px; color: var(--ink-3); margin-top: 8px; }

.flow-empty {
  text-align: center;
  padding: 44px 20px;
  color: var(--ink-3);
  font-size: 15px;
}
.flow-empty strong { display: block; color: var(--ink-2); font-weight: 600; margin-bottom: 4px; }

.num { font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------- surfaces */

.flow-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-1);

}

  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  opacity: 0.78;
  margin-bottom: 10px;
}
.flow-tile .flow-tile-note { font-size: 14px; opacity: 0.86; margin-top: 8px; }

/* --------------------------------------------------------------- controls */

.flow-field { margin-bottom: 14px; }

.flow-input, .flow-select, .flow-textarea {

  min-height: var(--tap);
  padding: 12px 14px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r);
  background: var(--surface);
  color: var(--ink);
  font-size: 16px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.flow-textarea { min-height: 120px; resize: vertical; line-height: 1.5; }
.flow-input:focus, .flow-select:focus, .flow-textarea:focus {
  outline: none;
  border-color: var(--a2);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--a2) 22%, transparent);
}
.flow-input::placeholder, .flow-textarea::placeholder { color: var(--ink-3); }
.flow-input[inputmode="decimal"], .flow-input[type="number"] { font-variant-numeric: tabular-nums; }

.flow-select {
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
  background-position: calc(100% - 19px) 50%, calc(100% - 13px) 50%;
  background-size: 6px 6px, 6px 6px;
  background-repeat: no-repeat;
  padding-right: 38px;
}

.flow-row { display: flex; gap: 10px; }
.flow-row > * { flex: 1; min-width: 0; }

.flow-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  min-height: 52px;
  padding: 0 20px;
  border: 0;
  border-radius: var(--r);
  background: linear-gradient(135deg, var(--a1), var(--a2));
  color: #fff;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.01em;
  cursor: pointer;
  box-shadow: var(--shadow-1);
  transition: transform 0.16s var(--ease), filter 0.16s, opacity 0.16s;
}
.flow-btn:active { transform: scale(0.975); filter: brightness(0.95); }
.flow-btn[disabled] { opacity: 0.4; pointer-events: none; }
.flow-btn svg { width: 19px; height: 19px; }

.flow-btn.is-quiet {
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--line-strong);
  box-shadow: none;
}
.flow-btn.is-ghost { background: none; color: var(--ink-2); box-shadow: none; font-weight: 550; }
.flow-btn.is-danger { background: none; color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent); box-shadow: none; }
.flow-btn.is-small { min-height: 40px; font-size: 14px; padding: 0 14px; width: auto; }

/* A row of mutually exclusive choices. */
.flow-segment {
  display: flex;
  gap: 3px;
  padding: 3px;
  background: var(--bg-deep);
  border-radius: var(--r);
  border: 1px solid var(--line);
}
.flow-segment button {
  flex: 1;
  min-width: 0;
  min-height: 40px;
  padding: 0 10px;
  border: 0;
  border-radius: 11px;
  background: transparent;
  color: var(--ink-2);
  font-size: 14px;
  font-weight: 560;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: background 0.18s var(--ease), color 0.18s, box-shadow 0.18s;
}

  color: var(--ink);

}

/* Chips: filters, tags, quick picks. */
.flow-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.flow-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
  padding: 0 13px;
  border: 1px solid var(--line-strong);

  background: var(--surface);
  color: var(--ink-2);
  font-size: 14px;

}
.flow-chip:active { transform: scale(0.95); }
.flow-chip[aria-pressed="true"], .flow-chip.is-on {
  background: linear-gradient(135deg, var(--a1), var(--a2));
  border-color: transparent;
  color: #fff;
}

/* Stepper for counts that people nudge rather than type. */
.flow-stepper {
  display: flex;
  align-items: center;
  gap: 2px;
  background: var(--bg-deep);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 3px;
}
.flow-stepper button {
  width: 42px;
  height: 42px;
  border: 0;
  border-radius: 11px;
  background: var(--surface);
  color: var(--ink);
  font-size: 21px;
  font-weight: 500;
  cursor: pointer;
  box-shadow: var(--shadow-1);
  transition: transform 0.12s var(--ease);
}
.flow-stepper button:active { transform: scale(0.9); }
.flow-stepper output {
  flex: 1;
  text-align: center;
  font-size: 17px;
  font-weight: 620;
  font-variant-numeric: tabular-nums;
}

.flow-check {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: var(--tap);
  padding: 4px 2px;
  cursor: pointer;
}

  height: 25px;

}

.flow-check input:checked + .box { background: linear-gradient(135deg, var(--a1), var(--a2)); border-color: transparent; }

.flow-check input:checked ~ .txt { color: var(--ink-3); text-decoration: line-through; }
.flow-check .txt { transition: color 0.18s; }

/* ------------------------------------------------------------------ lists */

.flow-list { border-radius: var(--r-lg); overflow: hidden; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow-1); }
.flow-list > li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); }
.flow-list > li:first-child { border-top: 0; }
.flow-list .grow { flex: 1; min-width: 0; }
.flow-list .name { font-weight: 560; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flow-list .sub { font-size: 13px; color: var(--ink-3); }
.flow-list .val { font-variant-numeric: tabular-nums; font-weight: 620; }

.flow-x {
  flex: none;
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--ink-3);
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.flow-x:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }
.flow-x svg { width: 16px; height: 16px; }

/* ---------------------------------------------------------------- overlays */

.flow-scrim {
  position: fixed;
  inset: 0;
  z-index: 90;
  background: rgba(9, 9, 11, 0.42);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  opacity: 0;
  transition: opacity 0.28s var(--ease);
}
.flow-scrim.is-open { opacity: 1; }

.flow-sheet {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 91;
  max-height: 88dvh;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 10px max(16px, env(safe-area-inset-left)) calc(16px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-right));
  background: var(--surface);
  border-radius: 26px 26px 0 0;
  box-shadow: var(--shadow-3);
  transform: translateY(100%);
  transition: transform 0.36s var(--ease);
}
.flow-sheet.is-open { transform: translateY(0); }
@media (min-width: 620px) {
  .flow-sheet {
    left: 50%;
    right: auto;
    bottom: 50%;
    width: 440px;
    max-width: calc(100vw - 32px);
    border-radius: 24px;
    transform: translate(-50%, 60%) scale(0.96);
    opacity: 0;
    transition: transform 0.3s var(--ease), opacity 0.3s var(--ease);
  }
  .flow-sheet.is-open { transform: translate(-50%, 50%); opacity: 1; }
}

.flow-grip { width: 38px; height: 4px; border-radius: 2px; background: var(--line-strong); margin: 2px auto 12px; }
@media (min-width: 620px) { .flow-grip { display: none; } }

.flow-sheet h2 { font-size: 19px; font-weight: 650; letter-spacing: -0.02em; margin: 0 4px 4px; }
.flow-sheet .sheet-lede { font-size: 14.5px; color: var(--ink-2); margin: 0 4px 14px; }

.flow-menu { display: flex; flex-direction: column; gap: 2px; }
.flow-menu button {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  min-height: 54px;
  padding: 0 12px;
  border: 0;
  border-radius: var(--r);
  background: transparent;
  color: var(--ink);
  font-size: 16px;
  font-weight: 520;
  text-align: left;
  cursor: pointer;
  transition: background 0.14s;
}
.flow-menu button:hover { background: var(--surface-2); }
.flow-menu button:active { background: var(--bg-deep); }
.flow-menu button .mi {
  flex: none;
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  background: var(--bg-deep);
  color: var(--ink-2);
}

.flow-menu button .mt { flex: 1; min-width: 0; }

.flow-toasts {
  position: fixed;
  left: 50%;
  bottom: calc(22px + env(safe-area-inset-bottom));
  z-index: 95;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  pointer-events: none;
  width: max-content;
  max-width: calc(100vw - 32px);
}
.flow-toast {
  padding: 11px 18px;
  border-radius: 999px;
  background: #18181b;
  color: #fafafa;
  font-size: 14.5px;
  font-weight: 520;
  box-shadow: var(--shadow-2);
  animation: flow-toast-in 0.32s var(--ease);
}
@media (prefers-color-scheme: dark) { .flow-toast { background: #f4f4f5; color: #18181b; } }
.flow-toast.is-out { animation: flow-toast-out 0.26s var(--ease) forwards; }
@keyframes flow-toast-in { from { opacity: 0; transform: translateY(14px) scale(0.94); } }
@keyframes flow-toast-out { to { opacity: 0; transform: translateY(10px) scale(0.96); } }

/* The Add-to-Home-Screen coach. */
.flow-coach { text-align: center; padding: 6px 6px 2px; }
.flow-coach h2 { text-align: center; }
.flow-coach .sheet-lede { text-align: center; }
.flow-steps { display: flex; flex-direction: column; gap: 10px; margin: 16px 0 18px; text-align: left; }
.flow-steps li {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--r);
  font-size: 15px;
}
.flow-steps .n {
  flex: none;
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--a1), var(--a2));
  color: #fff;
  font-size: 13px;
  font-weight: 650;
}
.flow-steps svg { width: 18px; height: 18px; vertical-align: -4px; margin: 0 2px; }

/* The screen a deleted Flow leaves behind. */
.flow-gone {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  min-height: 100dvh;
  padding: 32px;
  text-align: center;
}

.flow-gone h1 { font-size: 22px; font-weight: 650; letter-spacing: -0.02em; }
.flow-gone p { color: var(--ink-2); max-width: 30ch; }

.flow-hidden { display: none !important; }

  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

.st-habit {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);

}

.st-top { display: flex; align-items: center; gap: 12px; }
.st-tick {
  flex: none;
  width: 46px;
  height: 46px;
  display: grid;
  place-items: center;
  border: 2px solid var(--line-strong);
  border-radius: 15px;
  background: none;
  color: transparent;
  cursor: pointer;
  transition: all 0.22s var(--ease);
}
.st-tick svg { width: 21px; height: 21px; }
.st-habit.is-done .st-tick {
  background: linear-gradient(135deg, var(--a1), var(--a2));
  border-color: transparent;
  color: #fff;
  transform: scale(1.04);
}
.st-tick:active { transform: scale(0.9); }

.st-name { flex: 1; min-width: 0; font-size: 16px; font-weight: 570; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st-run { flex: none; text-align: right; }
.st-run b { display: block; font-size: 20px; font-weight: 660; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.st-run span { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }

      ['Running from', where],
      ['Storage', store.persistent ? 'Saved on this device' : 'Memory only — back up before you close it'],
      ['Offline', env.mode === 'file' ? 'Always' : (navigator.serviceWorker ? 'Yes, once it has loaded once' : 'Not on this browser')],
      ['Sends data anywhere', 'No. Everything stays on this device.']
    ];
    var ul = h('ul', { class: 'flow-list' });
    rows.forEach(function (r) {
      ul.appendChild(h('li', {}, h('span', { class: 'grow' },
        h('span', { class: 'sub', text: r[0] }), h('div', { class: 'name', style: { whiteSpace: 'normal' }, text: r[1] }))));
    });
    body.appendChild(ul);
    body.appendChild(h('p', { class: 'flow-hint', text: 'A TexFlow Flow. One file, one job.' }));
    sheet({ title: META.name, lede: META.blurb || META.tagline, body: body, actions: [{ label: 'Close', kind: 'ghost' }] });
  }

  // ----------------------------------------------------------------- chrome ---

  function buildChrome() {
    var bar = $('.flow-bar');
    if (!bar) return;
    bar.innerHTML = '';
    if (META.mark) bar.appendChild(h('span', { class: 'flow-mark-sm', html: META.mark }));
    bar.appendChild(h('span', { class: 'flow-bar-title', text: META.name || 'Flow' }));
    bar.appendChild(h('span', { class: 'flow-bar-spacer' }));
    bar.appendChild(h('button', {
      class: 'flow-icon-btn', type: 'button', 'aria-label': 'Menu', html: ICON.more, onclick: openMenu
    }));

    var sentinel = h('div', { style: { position: 'absolute', top: '0', height: '1px', width: '1px' } });
    document.body.appendChild(sentinel);
    if (window.IntersectionObserver) {
      new IntersectionObserver(function (entries) {
        bar.classList.toggle('is-stuck', !entries[0].isIntersecting);
      }).observe(sentinel);
    }
  }

  function registerWorker() {
    if (!('serviceWorker' in navigator)) return;
    if (location.protocol !== 'https:' && location.hostname !== 'localhost') return;
    var base = basePath();
    if (base === '/') return;
    navigator.serviceWorker.register(base + 'sw.js', { scope: base }).catch(function () {});
  }

  // The nudge the whole share flow rests on: someone tapped a link in a
  // message, the Flow is already open and working, and *then* it offers to
  // stay. Once, never again on this device, and never over the top of a first
  // interaction — the Flow has to prove itself first.
  function maybeCoach() {
    if (env.installed || env.mode === 'file') return;
    if (store.get('__coached', false)) return;
    if (env.mode !== 'instance' && !new URLSearchParams(location.search).has('keep')) return;
    setTimeout(function () {
      if (openSheets) return;
      installCoach(true);
    }, 2600);
  }

  // ------------------------------------------------------------------- boot ---

  var readyFns = [];
  var booted = false;

  function boot() {
    if (booted) return;
    booted = true;
    var seed = takeSeed();
    PRISTINE = '<!doctype html>\n' + document.documentElement.outerHTML;
    applySeed(seed);
    document.documentElement.style.setProperty('--a1', (META.colors && META.colors[0]) || '#0369a1');
    document.documentElement.style.setProperty('--a2', (META.colors && META.colors[1]) || '#38bdf8');
    buildChrome();
    readyFns.forEach(function (fn) { try { fn(); } catch (e) { console.error(e); } });
    registerWorker();
    maybeCoach();
    // Any first tap is a user gesture; use it to unlock audio for the timers.
    document.addEventListener('pointerdown', function once() {
      document.removeEventListener('pointerdown', once);
      try { audio(); } catch (e) {}
    }, { once: true });
  }

  window.Flow = {
    meta: META,
    env: env,
    icons: ICON,
    ready: function (fn) { if (booted) fn(); else readyFns.push(fn); },
    $: $, $$: $$, h: h, esc: esc,
    store: store, state: state,
    toast: toast, haptic: haptic, sheet: sheet, confirm: confirm,
    num: num, money: money, dur: dur, today: today, slug: slug,
    beep: beep, audio: audio,
    keepAwake: function (on) { wakeLockWanted = !!on; keepAwake(!!on); },
    saveBlob: saveBlob, pickFile: pickFile,
    share: share, copyLink: copyLink,
    saveFile: saveFileSheet, exportData: exportData, importData: importData,
    install: function () { installCoach(false); },
    remove: remove, openMenu: openMenu
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
<script>/* Streak.
 *
 * Days are stored as plain "YYYY-MM-DD" strings in the phone's own timezone,
 * not as timestamps. That matters more than it sounds: a tick at 11pm and a
 * tick at 1am are different days to a person, and an app that quietly disagrees
 * because it stored UTC will break someone's chain and lose their trust in one
 * go. Anything that touches "which day is it" goes through dayKey. */

Flow.ready(function () {
  var s = Flow.state('habits', { list: [] });
  var listEl = Flow.$('#list');
  var answerEl = Flow.$('#answer');

  function dayKey(offset) {
    var d = new Date();
    d.setDate(d.getDate() - (offset || 0));
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function streak(habit) {
    var run = 0;
    // Today not being ticked yet does not break a chain — it has not ended,
    // it just has not happened. Counting starts at yesterday in that case.
    var start = habit.days.indexOf(dayKey(0)) > -1 ? 0 : 1;
    for (var i = start; i < 4000; i++) {
      if (habit.days.indexOf(dayKey(i)) > -1) run++;
      else break;
    }
    return run;
  }

  function best(habit) {
    var sorted = habit.days.slice().sort();
    var run = 0;
    var top = 0;
    var prev = null;
    sorted.forEach(function (key) {
      var d = new Date(key + 'T12:00:00');
      run = prev && (d - prev) <= 36 * 3600000 ? run + 1 : 1;
      top = Math.max(top, run);
      prev = d;
    });
    return top;
  }

  function toggle(habit) {
    var key = dayKey(0);
    var at = habit.days.indexOf(key);
    if (at > -1) habit.days.splice(at, 1);
    else { habit.days.push(key); Flow.haptic(30); }
    s.save();
    render();
  }

  function render() {
    var doneToday = s.list.filter(function (h) { return h.days.indexOf(dayKey(0)) > -1; }).length;

    answerEl.innerHTML = '';
    var tile = Flow.h('div', { class: 'flow-tile' });
    tile.appendChild(Flow.h('div', { class: 'flow-tile-label', text: 'Today' }));
    tile.appendChild(Flow.h('div', {
      class: 'flow-tile-value',
      text: s.list.length ? doneToday + ' of ' + s.list.length : '—'
    }));
    tile.appendChild(Flow.h('div', {
      class: 'flow-tile-note',
      text: !s.list.length ? 'Add the first thing you want to do every day.'
        : doneToday === s.list.length ? 'All of them. That is the whole job.'
        : 'Longest run going: ' + s.list.reduce(function (a, h) { return Math.max(a, streak(h)); }, 0) + ' days.'
    }));
    answerEl.appendChild(tile);

    listEl.innerHTML = '';
    s.list.forEach(function (habit) {
      var done = habit.days.indexOf(dayKey(0)) > -1;
      var card = Flow.h('div', { class: 'st-habit' + (done ? ' is-done' : '') });

      var top = Flow.h('div', { class: 'st-top' });
      top.appendChild(Flow.h('button', {
        class: 'st-tick', type: 'button', html: Flow.icons.check,
        'aria-label': (done ? 'Undo ' : 'Tick ') + habit.name, 'aria-pressed': done ? 'true' : 'false',
        onclick: function () { toggle(habit); }
      }));
      top.appendChild(Flow.h('span', {
        class: 'st-name', text: habit.name,
        onclick: function () { editSheet(habit); }, style: { cursor: 'pointer' }
      }));
      var run = streak(habit);
      top.appendChild(Flow.h('span', { class: 'st-run' },
        Flow.h('b', { text: String(run) }),
        Flow.h('span', { text: run === 1 ? 'day' : 'days' })));
      card.appendChild(top);

      var grid = Flow.h('div', { class: 'st-grid' });
      for (var i = 27; i >= 0; i--) {
        var key = dayKey(i);
        grid.appendChild(Flow.h('i', {
          class: (habit.days.indexOf(key) > -1 ? 'on' : '') + (i === 0 ? ' today' : ''),
          title: key
        }));
      }
      card.appendChild(grid);

      var b = best(habit);
      card.appendChild(Flow.h('div', { class: 'st-foot' },
        Flow.h('span', { text: 'four weeks' }),
        Flow.h('span', { text: b > run ? 'best run ' + b + ' days' : 'this is your best run' })));

      listEl.appendChild(card);
    });

    if (!s.list.length) {
      listEl.appendChild(Flow.h('div', { class: 'flow-empty' },
        Flow.h('strong', { text: 'Nothing to keep going yet' }),
        'One or two habits works. Ten does not.'));
    }
  }

  function editSheet(existing) {
    var input = Flow.h('input', {
      class: 'flow-input', placeholder: 'Read for 20 minutes', 'aria-label': 'Habit',
      value: existing ? existing.name : ''
    });
    var actions = [{
      label: existing ? 'Save it' : 'Add it', onClick: function () {
        var name = input.value.trim().slice(0, 48);
        if (!name) return;
        if (existing) existing.name = name;
        else s.list.push({ id: String(Date.now()), name: name, days: [] });
        s.save(); render(); Flow.haptic();
      }
    }];
    if (existing) {
      actions.push({ label: 'Delete', kind: 'danger', onClick: function () {
        Flow.confirm({
          title: 'Delete ' + existing.name + '?',
          lede: 'Its whole history goes with it.',
          confirmLabel: 'Delete it', danger: true
        }).then(function (ok) {
          if (!ok) return;
          s.list = s.list.filter(function (h) { return h.id !== existing.id; });
          s.save(); render();
        });
      } });
    }
    actions.push({ label: 'Cancel', kind: 'ghost' });

    Flow.sheet({
      title: existing ? existing.name : 'A habit',
      lede: existing ? 'Ticked on ' + existing.days.length + ' days so far.' : 'Something small, every day.',
      body: Flow.h('div', {}, input),
      actions: actions
    });
    setTimeout(function () { input.focus(); }, 420);
  }

  Flow.$('#add').addEventListener('click', function () { editSheet(null); });

  // Left open overnight, the grid and the streaks would be a day stale.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') render();
  });

  render();
});</script>
</body>
</html>
