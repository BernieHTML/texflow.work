<!-- Crawlable copy of what the app is, for readers without JS. -->
<noscript>
  <div style="position:absolute;inset:0;z-index:3000;overflow:auto;background:#05070c;padding:28px 18px">
    <div style="max-width:640px;margin:0 auto">
      <h1>OurMoon — claim your lunar base</h1>
      <p>OurMoon is a shared map of the Moon's south pole. Sign up with a username, claim a plot on real
      LROC orthomosaic imagery, name your lunar base, and site a Lunar Thermal Energy Conversion (LTEC)
      power plant that draws on the temperature gap between a peak of eternal light and a permanently
      shadowed region.</p>
      <h2>The siting rules</h2>
      <ul>
        <li>A new base must be at least 10 km clear of every existing base and LTEC plant.</li>
        <li>An LTEC plant must sit inside a peak of eternal light — the hot side.</li>
        <li>An LTEC plant must be within 10 km of a permanently shadowed region — the cold sink.</li>
        <li>An LTEC plant must be within 10 km of the base it powers.</li>
      </ul>
      <p>Every live base is published at
      <a href="/ourmoon/bases.json" style="color:#7ee0c8">/ourmoon/bases.json</a> with names, owners and
      selenographic coordinates. The map itself needs JavaScript.</p>
    </div>
  </div>
</noscript>
