<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How should we negotiate? — Gander</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/gander/styles.css">
  <style>
    .mode-page { max-width: 640px; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
    .mode-title { margin: 0 0 0.5rem; font-size: 1.5rem; }
    .mode-sub { color: var(--muted); margin: 0 0 1.5rem; font-size: 0.95rem; }
    .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem; }
    @media (max-width: 560px) { .mode-grid { grid-template-columns: 1fr; } }
    .mode-card {
      border: 1px solid var(--border); border-radius: var(--radius); padding: 1.15rem 1.1rem;
      background: var(--surface); cursor: pointer; text-align: left;
      transition: border-color 0.2s, box-shadow 0.2s;
      font: inherit; color: inherit;
    }
    .mode-card:hover { border-color: rgba(91, 141, 239, 0.5); box-shadow: 0 0 0 1px rgba(91, 141, 239, 0.15); }
    .mode-card.rec { border-color: rgba(125, 255, 179, 0.35); }
    .mode-card h3 { margin: 0 0 0.4rem; font-size: 1.05rem; }
    .mode-card p { margin: 0; font-size: 0.88rem; color: var(--muted); line-height: 1.45; }
    .badge-rec { display: inline-block; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #7dffb3; margin-bottom: 0.35rem; }
    #ai-form-wrap { display: none; }
    #ai-form-wrap.visible { display: block; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    @media (max-width: 500px) { .form-grid { grid-template-columns: 1fr; } }
    .check-row { display: flex; flex-wrap: wrap; gap: 0.65rem 1rem; margin-top: 0.35rem; }
    .check-row label { display: inline-flex; align-items: center; gap: 0.35rem; font-weight: 400; font-size: 0.88rem; cursor: pointer; }
  </style>
</head>
<body>
  <div class="mode-page">
    <p class="meta"><a href="/gander/">← Gander</a></p>
    <h1 class="mode-title">Choose how to negotiate</h1>
    <p class="mode-sub" id="room-line"></p>

    <div class="mode-grid">
      <button type="button" class="mode-card" id="btn-human" aria-describedby="human-desc">
        <h3>Negotiate for myself</h3>
        <p id="human-desc">You’ll handle offers and counter-offers in the room. Best if you want full control.</p>
      </button>
      <button type="button" class="mode-card rec" id="btn-ai" aria-describedby="ai-desc">
        <span class="badge-rec">Recommended</span>
        <h3>Let AI negotiate</h3>
        <p id="ai-desc">Configure targets and style; Groq-powered suggestions help you counter skilled buyers. You approve each move.</p>
      </button>
    </div>

    <p id="mode-err" class="err" hidden></p>

    <div id="ai-form-wrap" class="card">
      <h2 style="margin:0 0 1rem;font-size:1.1rem;">AI strategy</h2>
      <form id="ai-form">
        <div class="form-grid">
          <div>
            <label for="target_price">Target price (aim)</label>
            <input type="number" id="target_price" name="target_price" step="any" required placeholder="500">
          </div>
          <div>
            <label for="walk_away_price">Walk-away floor (minimum)</label>
            <input type="number" id="walk_away_price" name="walk_away_price" step="any" required placeholder="420">
          </div>
        </div>
        <label for="currency" style="margin-top:0.75rem;">Currency</label>
        <input type="text" id="currency" name="currency" value="USD" maxlength="8" required>

        <label style="margin-top:0.75rem;">Concession style</label>
        <select id="concession_style" name="concession_style" style="width:100%;padding:0.65rem;border-radius:8px;border:1px solid var(--border);background:#0c0f14;color:var(--text);font-family:inherit;">
          <option value="slow_bleed">Slow bleed — small steps (signals you’re near limit)</option>
          <option value="aggressive_early">Aggressive early — larger first concession</option>
          <option value="hold_firm_then_drop">Hold firm, then one meaningful drop</option>
        </select>

        <p style="margin:0.75rem 0 0.25rem;font-size:0.9rem;font-weight:500;">Also negotiable (besides price)</p>
        <div class="check-row">
          <label><input type="checkbox" name="term" value="payment_terms"> Payment terms</label>
          <label><input type="checkbox" name="term" value="quantity"> Quantity</label>
          <label><input type="checkbox" name="term" value="delivery_timeline"> Delivery timeline</label>
          <label><input type="checkbox" name="term" value="warranty"> Warranty</label>
        </div>

        <label style="margin-top:0.75rem;">Tone</label>
        <select id="tone" name="tone" style="width:100%;padding:0.65rem;border-radius:8px;border:1px solid var(--border);background:#0c0f14;color:var(--text);font-family:inherit;">
          <option value="collaborative">Collaborative — find overlap</option>
          <option value="firm">Firm — clear positions</option>
        </select>

        <div class="row" style="margin-top:0.75rem;">
          <div>
            <label for="max_rounds">Max AI-assisted rounds</label>
            <input type="number" id="max_rounds" name="max_rounds" min="1" max="50" value="6" required>
          </div>
          <div>
            <label for="seller_agent_name">Your agent name (shown on offers)</label>
            <input type="text" id="seller_agent_name" name="seller_agent_name" placeholder="GanderSeller" maxlength="64">
          </div>
        </div>

        <p style="margin-top:1.25rem;margin-bottom:0;">
          <button type="submit" class="btn" id="ai-submit">Start room with AI</button>
        </p>
        <p id="ai-form-err" class="err" hidden></p>
      </form>
    </div>
  </div>
  <script>
    (function () {
      var API =
        (window.location.pathname.indexOf('/gander') >= 0 ? '/gander' : '') +
        '/api/rooms';
      var params = new URLSearchParams(window.location.search);
      var roomId = params.get('room');
      var line = document.getElementById('room-line');
      var err = document.getElementById('mode-err');
      var aiWrap = document.getElementById('ai-form-wrap');

      if (!roomId) {
        line.textContent = 'Missing room. Create a room from the home page first.';
        document.querySelector('.mode-grid').style.display = 'none';
        return;
      }
      line.textContent = 'Room ID: ' + roomId;

      function showErr(msg) {
        err.textContent = msg || '';
        err.hidden = !msg;
      }

      document.getElementById('btn-human').addEventListener('click', function () {
        showErr('');
        fetch(API + '/' + encodeURIComponent(roomId) + '/strategy', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mode: 'human' }),
        })
          .then(function (r) {
            return r.json().then(function (d) {
              if (!r.ok) throw new Error(d.error || r.statusText);
              return d;
            });
          })
          .then(function (d) {
            window.location.href = d.url || '/gander/room/' + roomId;
          })
          .catch(function (e) {
            showErr(e.message || 'Failed.');
          });
      });

      document.getElementById('btn-ai').addEventListener('click', function () {
        aiWrap.classList.add('visible');
        aiWrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });

      document.getElementById('ai-form').addEventListener('submit', function (ev) {
        ev.preventDefault();
        var fe = document.getElementById('ai-form-err');
        fe.hidden = true;
        var terms = [];
        document.querySelectorAll('input[name="term"]:checked').forEach(function (c) {
          terms.push(c.value);
        });
        var body = {
          mode: 'ai',
          target_price: Number(document.getElementById('target_price').value),
          walk_away_price: Number(document.getElementById('walk_away_price').value),
          currency: document.getElementById('currency').value.trim(),
          concession_style: document.getElementById('concession_style').value,
          tradeable_terms: terms,
          tone: document.getElementById('tone').value,
          max_rounds: Number.parseInt(document.getElementById('max_rounds').value, 10),
          seller_agent_name: document.getElementById('seller_agent_name').value.trim() || 'GanderSeller',
        };
        fetch(API + '/' + encodeURIComponent(roomId) + '/strategy', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        })
          .then(function (r) {
            return r.json().then(function (d) {
              if (!r.ok) throw new Error(d.error || r.statusText);
              return d;
            });
          })
          .then(function (d) {
            window.location.href = d.url || '/gander/room/' + roomId;
          })
          .catch(function (e) {
            fe.textContent = e.message || 'Failed.';
            fe.hidden = false;
          });
      });
    })();
  </script>
</body>
</html>
